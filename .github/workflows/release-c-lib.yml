name: release-c-lib
# A C library's release: its RPMs, then its DEBs, through build-rpm.yml and build-deb.yml. A tag push publishes; any
# other run is a dry run (publish false), and a pull request's dry run passes arm false.
#
# Both kinds are built first (stage build), channel-installability.yml checks the channel with them in it, and only
# then is either published (stage publish, RPMs then DEBs): no release leaves a package of either channel
# uninstallable, and none publishes one kind before the other kind is known to fit (plugin-hostd-protocol 0.5.0
# published alone above its consumers' ceiling). same-pass names the packages other repositories release
# in the same pass, whose breakage is then reported, not red.
#
#   on: {push: {tags: ['v*']}, workflow_dispatch: {}}
#   jobs:
#     release:
#       uses: FreeMixer/.github/.github/workflows/release-c-lib.yml@v1
#       with:
#         package-name: omx-dsp
#         rpm-binary-names: omx-dsp-devel
#         deb-binary-names: libomxdsp-dev
#       secrets: inherit
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
      rpm-binary-names:
        description: the RPMs the spec builds; empty is the package name
        type: string
        default: ''
      deb-binary-names:
        description: the DEBs debian/control builds; empty is the package name
        type: string
        default: ''
      publish:
        type: boolean
        default: false
      arm:
        description: build aarch64/arm64 too
        type: boolean
        default: true
      needs-mod-host:
        type: boolean
        default: false
      channel-deps:
        type: boolean
        default: true
      deb-dependencies:
        type: string
        default: ''
      deb-requires:
        type: string
        default: ''
      runner:
        type: string
        default: ubuntu-latest
      same-pass:
        description: packages other repositories release in the same pass, space separated (channel-installability)
        type: string
        default: ''
    secrets:
      DISPATCH_TOKEN:
        required: false
      OPENMIXER_PACKAGES_SIGNING_KEY:
        required: false
      PAGES_TOKEN:
        required: false
      SITE_GPG_KEY:
        required: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm-build:
    uses: FreeMixer/.github/.github/workflows/build-rpm.yml@v1
    with:
      package-name: ${{ inputs.package-name }}
      binary-names: ${{ inputs.rpm-binary-names || inputs.package-name }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      stage: build
      needs-mod-host: ${{ inputs.needs-mod-host }}
      channel-deps: ${{ inputs.channel-deps }}
      runner: ${{ inputs.runner }}
      arch-matrix: ${{ inputs.arm && '["x86_64", "aarch64"]' || '["x86_64"]' }}
    secrets: inherit
  deb-build:
    needs: rpm-build
    if: ${{ !cancelled() && needs.rpm-build.result == 'success' }}
    uses: FreeMixer/.github/.github/workflows/build-deb.yml@v1
    with:
      package-name: ${{ inputs.package-name }}
      binary-names: ${{ inputs.deb-binary-names || inputs.package-name }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      stage: build
      dependencies: ${{ inputs.deb-dependencies }}
      requires: ${{ inputs.deb-requires }}
      channel-deps: ${{ inputs.channel-deps }}
      runner: ${{ inputs.runner }}
      arch-matrix: ${{ inputs.arm && '["amd64", "arm64"]' || '["amd64"]' }}
    secrets: inherit
  # before anything is published: both channels with this release in them still install what they installed
  installability:
    needs: [rpm-build, deb-build]
    if: ${{ !cancelled() && needs.rpm-build.result == 'success' && needs.deb-build.result == 'success' }}
    uses: FreeMixer/.github/.github/workflows/channel-installability.yml@v1
    with:
      rpm-artifacts: ${{ inputs.package-name }}-rpms-fc*
      deb-artifacts: ${{ inputs.package-name }}-debs-*-*
      same-pass: ${{ inputs.same-pass }}
  rpm:
    needs: installability
    if: ${{ !cancelled() && needs.installability.result == 'success' }}
    uses: FreeMixer/.github/.github/workflows/build-rpm.yml@v1
    with:
      package-name: ${{ inputs.package-name }}
      binary-names: ${{ inputs.rpm-binary-names || inputs.package-name }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      stage: publish
      same-pass: ${{ inputs.same-pass }}
      needs-mod-host: ${{ inputs.needs-mod-host }}
      channel-deps: ${{ inputs.channel-deps }}
      runner: ${{ inputs.runner }}
      arch-matrix: ${{ inputs.arm && '["x86_64", "aarch64"]' || '["x86_64"]' }}
    secrets: inherit
  deb:
    needs: rpm
    if: ${{ !cancelled() && needs.rpm.result == 'success' }}
    uses: FreeMixer/.github/.github/workflows/build-deb.yml@v1
    with:
      package-name: ${{ inputs.package-name }}
      binary-names: ${{ inputs.deb-binary-names || inputs.package-name }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      stage: publish
      same-pass: ${{ inputs.same-pass }}
      dependencies: ${{ inputs.deb-dependencies }}
      requires: ${{ inputs.deb-requires }}
      channel-deps: ${{ inputs.channel-deps }}
      runner: ${{ inputs.runner }}
      arch-matrix: ${{ inputs.arm && '["amd64", "arm64"]' || '["amd64"]' }}
    secrets: inherit
