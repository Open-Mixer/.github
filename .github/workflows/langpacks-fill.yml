name: langpacks-fill
# The language-pack FILL, on our own pool (owner ruling, 2026-11-20): the fill needs the cluster's llm-router, which only
# the self-hosted runners reach (cluster DNS 10.43.0.10), and fill.py refuses a GitHub-hosted runner. The organisation
# variable for the runner stays ubuntu-latest for everything else, so the fill is its own job here: it runs on arc-freemixer,
# the ARC scale set, and its container is ALWAYS given the cluster DNS (this job never runs anywhere else). The caller's
# check-only catalogs job (fill: false) stays on that variable and takes no DNS.
#
#   jobs:
#     fill:
#       uses: Open-Mixer/.github/.github/workflows/langpacks-fill.yml@openmixer-v1
#       permissions: { contents: write }
#       with: { name: plugin-qualify, owner: plugin-qualify, spec: packaging/plugin-qualify.spec,
#               gate: tools/catalogs-gate.sh, fill-command: tools/catalogs-gate.sh }
#       secrets: inherit
#
# It runs on a pull request of the caller's own repository (never a fork: a fork never reaches our pool), OR on a
# workflow_dispatch: the callers' ci.yml is dispatch-only (no heavy Action on push or pull request), so the fill is
# reached by dispatching ci.yml on the lane branch that has an OPEN same-repository pull request into the default
# branch. A first step reads that pull request (pulls?head=<owner>:<ref>&state=open: exactly one, not a fork, base the
# default branch) and fails by name when there is not one; on a KEPT ref (the default branch, main, openmixer-v*, release/*,
# settle/*: a release, not a misuse) it skips cleanly with kept=true, every later step is guarded by it and nothing is
# ever pushed there (fill.py's own kept_ref refusal stays as the last guard); otherwise the push goes to that same ref
# only. The langpacks action fills and pushes signed to it, or names the gaps and fails.
on:
  workflow_call:
    inputs:
      name:
        description: the pack prefix (the owner's spec Name and debian/control Source)
        type: string
        required: true
      owner:
        description: the directory under /usr/share holding catalogs/
        type: string
        required: true
      spec:
        description: the spec, relative to the checkout ('' for none)
        type: string
        default: ''
      gate:
        description: the catalogs' release gate, run in the checkout
        type: string
        default: omx-contract translate --check --owner .
      fill-command:
        description: the command that makes one language's entries (--lang and --model are appended)
        type: string
        default: omx-contract translate --owner .
      packages:
        description: extra packages the gate needs, space-separated
        type: string
        default: ''
    secrets:
      OMX_ROUTER_KEY:
        required: false
      OPENMIXER_CI_SIGNING_KEY:
        required: false

jobs:
  fill:
    name: language packs fill
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork || github.event_name == 'workflow_dispatch'
    runs-on: arc-freemixer
    timeout-minutes: 30
    permissions:
      contents: write
    container:
      image: fedora:45
      options: --dns 10.43.0.10 --dns-search llm-router.svc.cluster.local --dns-search svc.cluster.local --dns-search cluster.local
    steps:
      # the caller's packages (omx-contract-devel, ...) are OpenMixer's: they install once its channel is added, below
      - run: dnf install -y --setopt=install_weak_deps=False git python3 nodejs gnupg2
      - name: The dispatched branch is the head of one open same-repository pull request
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request
          e = os.environ
          ref, repo, owner = e["GITHUB_REF_NAME"], e["GITHUB_REPOSITORY"], e["GITHUB_REPOSITORY_OWNER"]
          def refuse(why):
              print("::error::langpacks fill: " + why); sys.exit(1)
          if e.get("GITHUB_REF_TYPE") != "branch":
              refuse("the dispatched ref %s is not a branch" % ref)
          if ref == e["DEFAULT_BRANCH"] or ref == "main" or ref.startswith(("openmixer-v", "release/", "settle/")):
              # a release is not a misuse: skip cleanly, say so, and let every later step see kept=true
              open(e["GITHUB_OUTPUT"], "a").write("kept=true\n")
              print("fill skipped: %s is a kept ref; no strings are filled on a release branch" % ref)
              sys.exit(0)  # kept
          url = "%s/repos/%s/pulls?head=%s:%s&state=open" % (e["GITHUB_API_URL"], repo, owner, ref)
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + e["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          prs = json.load(urllib.request.urlopen(req))
          if len(prs) != 1:
              refuse("%d open pull requests have %s as their head (exactly one is needed): open one into %s, then dispatch again" % (len(prs), ref, e["DEFAULT_BRANCH"]))
          pr = prs[0]
          if pr["head"]["repo"]["full_name"] != repo or pr["head"]["repo"].get("fork") or pr["head"]["ref"] != ref:
              refuse("the pull request of %s is not from this repository's own branch" % ref)
          if pr["base"]["ref"] != e["DEFAULT_BRANCH"]:
              refuse("the pull request of %s targets %s, not %s" % (ref, pr["base"]["ref"], e["DEFAULT_BRANCH"]))
          open(e["GITHUB_OUTPUT"], "a").write("head-sha=%s\n" % pr["head"]["sha"])
          print("langpacks fill: %s is the head of open pull request #%d" % (ref, pr["number"]))
          PYEOF
      - uses: actions/checkout@v4
        if: steps.pr.outputs.kept != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.pr.outputs.head-sha }}
      - name: Add the OpenMixer channel
        if: steps.pr.outputs.kept != 'true'
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          staging: 'true'
          # a wave's branch reads that wave's devel channel above staging (.github#329)
          devel-channel: ${{ (github.event_name == 'workflow_dispatch' || github.base_ref == 'devel') && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ (github.event_name == 'workflow_dispatch' || github.base_ref == 'devel') && vars.OMX_DEVEL_BASE || '' }}
      - if: steps.pr.outputs.kept != 'true'
        run: dnf install -y --setopt=install_weak_deps=False omx-contract omx-contract-data ${{ inputs.packages }}
      - if: steps.pr.outputs.kept != 'true'
        uses: Open-Mixer/.github/.github/actions/langpacks@openmixer-v1
        with:
          name: ${{ inputs.name }}
          owner: ${{ inputs.owner }}
          spec: ${{ inputs.spec }}
          gate: ${{ inputs.gate }}
          fill-command: ${{ inputs.fill-command }}
          dispatch-head: ${{ steps.pr.outputs.head-sha }}
          router-key: ${{ secrets.OMX_ROUTER_KEY }}
          signing-key: ${{ secrets.OPENMIXER_CI_SIGNING_KEY }}
