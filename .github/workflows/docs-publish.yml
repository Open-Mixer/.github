name: docs-publish
# Every repository's generated reference, built from its own source by its own `make docs-site` and published on the
# site under /reference/<repo>/<version>/ and /reference/<repo>/latest/ (docs/docs-publish.md). A repository calls it
# with one `uses:` line; on a pull request it builds and assembles (the same make target, so an undocumented symbol is
# red there first), and on a release tag it publishes.
#
#   on:
#     push:
#       tags: ['v*']
#     pull_request:
#   jobs:
#     docs:
#       uses: Open-Mixer/.github/.github/workflows/docs-publish.yml@openmixer-v1
#       with:
#         apt: libjson-c-dev            # what the target needs beyond doxygen, pandoc and make; none by default
#         node-version: '24'            # a target that runs node; none by default
#       secrets: inherit
#
# The make target writes into $DOCS_OUT (an absolute, empty directory) and only what its generators produce from this
# checkout: doxygen's html, Markdown its tools render, its man pages; a doc check that needs no base runs first in the
# same target, so nothing is published past it. actions/docs-site renders the Markdown and man pages with
# pandoc, writes the entry page when the tree has none, refuses a tree with no page or a symbolic link, and places it. The publish is a signed commit into the
# Pages channel by channel-pull and channel-push, the paths reference/ alone; openmixer-www owns the site's other
# top-level paths (its deploy/site-owns.txt) and never reference/.
on:
  workflow_call:
    inputs:
      target:
        description: the make target that writes the reference into $DOCS_OUT
        type: string
        default: docs-site
      apt:
        description: apt packages the target needs beyond doxygen, pandoc and make, space-separated
        type: string
        default: ''
      node-version:
        description: the Node.js version a target that runs node needs (none means no Node.js set up)
        type: string
        default: ''
      version:
        description: the release number published; empty means the tag's name without its leading v
        type: string
        default: ''
      runner:
        description: runner label
        type: string
        default: ubuntu-24.04
    secrets:
      PAGES_TOKEN:
        required: false
      SITE_GPG_KEY:
        required: false

permissions:
  contents: read

env:
  CHANNEL: Open-Mixer/open-mixer.github.io

jobs:
  build:
    name: generated reference (make ${{ inputs.target }})
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      repo: ${{ steps.version.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: doxygen, pandoc and make from apt
        shell: bash
        env:
          APT: ${{ inputs.apt }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # APT is a space-separated list
          sudo apt-get install -y -qq --no-install-recommends doxygen pandoc make $APT
          doxygen --version; pandoc --version | head -n 1
      - if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - id: version
        name: the release number
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ] && [ "$REF_TYPE" = tag ]; then VERSION=${REF_NAME#v}; fi
          echo "version=${VERSION:-0.0.0-unreleased}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: make ${{ inputs.target }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/docs-site
          rm -rf "$out"; mkdir -p "$out"
          make "$TARGET" DOCS_OUT="$out"
          echo "DOCS_OUT=$out" >> "$GITHUB_ENV"
      - uses: Open-Mixer/.github/.github/actions/docs-site@openmixer-v1
        with:
          command: assemble
          site: ${{ env.DOCS_OUT }}
          title: ${{ steps.version.outputs.repo }} ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ env.DOCS_OUT }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish under /reference/${{ needs.build.outputs.repo }}/${{ needs.build.outputs.version }}/
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: docs-publish-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pandoc
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      - uses: Open-Mixer/.github/.github/actions/channel-pull@openmixer-v1
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          channel: ${{ env.CHANNEL }}
          strip: none
      - id: place
        uses: Open-Mixer/.github/.github/actions/docs-site@openmixer-v1
        with:
          command: place
          site: ${{ github.workspace }}/site
          channel: ${{ github.workspace }}/build/channel
          repo: ${{ needs.build.outputs.repo }}
          version: ${{ needs.build.outputs.version }}
      - id: push
        uses: Open-Mixer/.github/.github/actions/channel-push@openmixer-v1
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ env.CHANNEL }}
          tag: ${{ needs.build.outputs.repo }} ${{ needs.build.outputs.version }}
          what: reference
          rebuild: ${{ steps.place.outputs.rebuild }}

  pages-live:
    name: the Pages deployment carries the reference
    needs: publish
    if: needs.publish.outputs.commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: Open-Mixer/.github/.github/actions/pages-live@openmixer-v1
        with:
          channel: Open-Mixer/open-mixer.github.io
          commit: ${{ needs.publish.outputs.commit }}
          token: ${{ secrets.PAGES_TOKEN }}
