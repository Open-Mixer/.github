name: mod-host-protocol RPMs

# Builds mod-host, mod-host-protocol, which carries libmod-host-protocol.so.0, and mod-host-protocol-devel from the
# FreeMixer fork of mod-host at the commit .github/pins.txt names, by the fork's own packaging/mod-host.spec, for
# every architecture and publishes them into rpm/ of the Pages repository, where omx-clap-host and plugin-hostd
# Require them. Move the pin to the fork's release tag, then run this by hand: a published NEVRA is never rebuilt
# with new bytes (docs/mod-host.md).
#
# publish=false, the default, is a dry run: it builds and assembles an unsigned tree as an artifact.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on the main branch publishes'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to publish from anywhere but main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: echo "::error::publish is only for a run on main"; exit 1

      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-preflight
        with:
          publish: ${{ inputs.publish }}
          require-tag: 'false'
          target: FreeMixer/freemixer.github.io
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (fc${{ matrix.fedora }}, ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44', '45']
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/mod-host-rpms

      - name: Stage the packages and check what they carry
        env:
          ARCH: ${{ matrix.arch }}
          FEDORA: ${{ matrix.fedora }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp mod-host-rpms/mod-host-[0-9]*."$ARCH".rpm mod-host-rpms/mod-host-protocol-[0-9]*."$ARCH".rpm \
            mod-host-rpms/mod-host-protocol-devel-[0-9]*."$ARCH".rpm release/
          # the source package is the same for both architectures: one build files it, so the two never race for the name
          if [ "$ARCH" = x86_64 ]; then
            cp mod-host-rpms/SRPMS/mod-host-[0-9]*.src.rpm release/
            [ "$(rpm -qp --qf '%{SOURCERPM}' release/mod-host-[0-9]*."$ARCH".rpm)" = "$(basename release/*.src.rpm)" ] \
              || { echo "::error::the binaries do not name the staged source package"; exit 1; }
          fi
          for f in release/*.rpm; do rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' "$f"; done
          evr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' release/*.rpm | sort -u)
          [ "$(printf '%s\n' "$evr" | wc -l)" = 1 ] || { echo "::error::the packages carry more than one version: $evr"; exit 1; }
          case "$evr" in *.git*)
            [ "$PUBLISH" != true ] || { echo "::error::$evr is a snapshot: pin the fork's release tag"; exit 1; }
            echo "::warning::$evr is a snapshot, which a publish refuses" ;;
          esac
          case "$evr" in *.fc"$FEDORA") ;; *) echo "::error::$evr is not built for fc$FEDORA"; exit 1 ;; esac
          rpm -qp --provides release/mod-host-protocol-[0-9]*.rpm | grep '^libmod-host-protocol\.so\.0' \
            || { echo "::error::mod-host-protocol does not provide libmod-host-protocol.so.0"; exit 1; }
          if rpm -qp --provides release/mod-host-[0-9]*.rpm | grep '^libmod-host-protocol\.so\.0'; then
            echo "::error::mod-host still provides libmod-host-protocol.so.0"; exit 1
          fi
          rpm -qp --requires release/mod-host-[0-9]*.rpm | grep '^mod-host-protocol(' \
            || { echo "::error::mod-host does not require mod-host-protocol"; exit 1; }
          rpm -qp --provides release/mod-host-protocol-devel-*.rpm | grep '^pkgconfig(mod-host-protocol)' \
            || { echo "::error::mod-host-protocol-devel does not provide pkgconfig(mod-host-protocol)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mod-host-rpms-fc${{ matrix.fedora }}-${{ matrix.arch }}
          path: release/*.rpm
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    concurrency:
      group: publish-FreeMixer/freemixer.github.io
      cancel-in-progress: false
    env:
      DO_PUBLISH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mod-host-rpms-*
          merge-multiple: true
          path: collected

      - name: Read the version the packages carry
        run: echo "EVR=$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' collected/mod-host-protocol-[0-9]*.rpm | sort -u | head -1)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/publish-rpms
        with:
          rpm-dir: collected
          tag: mod-host-${{ env.EVR }}
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}

      # the release record: where each Fedora release's source package is served and its sha256, for a consumer to pin
      - name: Record the source packages
        run: |
          set -euo pipefail
          # a signed publish serves the signed copy, whose bytes differ from the built file's
          if [ "$DO_PUBLISH" = true ]; then dir=signed; else dir=collected; fi
          ./.github/actions/publish-rpms/record-srpm.sh "$dir" mod-host | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- published: $DO_PUBLISH ($dir copy)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: mod-host-unsigned-rpm-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30
