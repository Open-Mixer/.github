name: Build DEB (reusable)

# The Debian half of the release path of build-rpm.yml, for Raspberry Pi OS and Zynthian (Debian trixie,
# arm64 and amd64). Called from the same thin workflow, on the same v* tag:
#
#   jobs:
#     deb:
#       uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
#       with: { package-name: plugin-hostd }
#       secrets: inherit
#
# A tag builds the DEBs on every Debian release and architecture of the matrix (each on a runner of its own
# architecture, in a debian: container), runs lintian, signs the apt index and publishes into deb/ of the
# target Pages repository. Anything that is not a tag is a dry run: it builds, lints and assembles an UNSIGNED
# tree as an artifact.
#
# staged: true (a workflow_dispatch of the caller, never a tag) builds the quick set (trixie on arm64) or, told
# full, every suite of suite-matrix on every architecture of arch-matrix, against the staging channel, and
# publishes it to the staging channel of the release wave:
# staging/deb of the same target repository, signed with the same key, by the same tree script and channel-push as a
# release (docs/release-operations.md). The next layer's builds and install checks add that channel at a higher
# priority than the real one (staging: true here, add-openmixer staging: true elsewhere) and resolve to the staged
# packages with no code of their own. A staged run never writes the real channel; the wave's release pass publishes
# the whole set there once, from the v<version> tags, and the purge-staging workflow then empties the staging channel.
# staging: true on a run that is not staged (a dry run on a branch) builds against the staging channel and publishes
# nothing. Neither runs on a tag or with source-ref, and a staged run builds the calling repository's own commit.
#
# WHICH CELLS A RUN BUILDS (docs/release-operations.md, "The quick set and the full matrix"): the matrix input,
# quick or full, when the caller passes it. Without it a release (a tag, source-ref) builds what the organisation
# variable OMX_RELEASE_MATRIX says, and the FULL matrix when it is unset: a caller that changes nothing publishes
# every cell on a tag, as before, unless a release wave is open. A staged run and a workflow_dispatch build what the
# variable says and the QUICK set when it is unset; a pull request always builds the full matrix. The install checks
# run for the built cells, no others.
#
# The packaging is the debian/ directory of the calling repository; its changelog version is the version and
# must equal the packaging/*.spec Version when there is one, and the tag must be v<version>. What Debian does
# not carry, libmod-host-protocol (from the OpenMixer fork of mod-host) and the CLAP headers (from .github/pins.txt), is built first: the
# protocol library is published once by mod-host-protocol-deb.yml and the packages Depend on it, they never
# carry a copy; the CLAP headers are a build dependency only. A build dependency the channel already serves
# (plugin-hostd-dev) comes from the channel's apt source, added inside the build container only.
#
# Secrets (organisation secrets, passed by `secrets: inherit`): OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN,
# and RPM_GPG_KEY, RPM_GPG_PASSPHRASE, no longer read (declared optional so a caller that still passes them does not fail).
# The packages key signs the apt index as it signs the RPMs, alone.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label for the x86 jobs, GitHub-hosted by default (a private repo, or a job that needs a private runner, passes its own runners, e.g. arc-freemixer; the organisation variable OMX_RUNNER is not read; arm builds keep ubuntu-24.04-arm; a tag or release of a PUBLIC repository builds its x86 jobs on ubuntu-latest so a release never queues behind pull-request CI; a pull request from a fork always runs on GitHub-hosted runners)'
      package-name:
        required: true
        type: string
        description: 'Source package name, the Source of debian/control (e.g. plugin-hostd)'
      binary-names:
        type: string
        default: ''
        description: 'Binary DEBs the build must produce, space separated names or globs (e.g. libomxdsp-dev). Empty means package-name.'
      publish:
        type: boolean
        default: false
        description: 'Sign and publish. Takes effect on a tag only; false or a branch is a dry run.'
      staged:
        type: boolean
        default: false
        description: 'Build the matrix of a release against the staging channel and publish it to the staging channel (staging/deb of target-repo), never to the real one. Excludes publish.'
      # staged-deps is ignored: callers pass staging instead; removed in the wave's release pass once omx-panel, plugin-hostd and omx-clap-core have switched
      staged-deps:
        type: string
        default: ''
        description: 'Ignored, kept for this wave only so existing callers still validate; pass staging instead'
      staging:
        type: boolean
        default: false
        description: 'Add the staging channel at a higher priority than the real one to the build containers (staged: true implies it). A dry run only: never on a tag, with source-ref or with publish.'
      bootstrap:
        type: string
        default: ''
        description: 'A real build-dependency cycle (Open-Mixer/.github#230): -contract data packages of a sibling, each built alone from its source at a named commit before the build (actions/contract-bootstrap), space separated <owner>/<repo>@<full commit>:<package>. Installed in the build container to meet the build''s dependencies and never released; the sibling''s own release replaces them'
      bootstrap-only:
        type: boolean
        default: false
        description: 'Release the one bootstrap package itself instead of the calling repository''s tree: package-name is that package, source-ref is v<its version>, and it goes out at the house snapshot version below the sibling''s own release (rpm Release 0.git<time>.<sha>, deb <version>~git<time>.<sha>), which replaces it. For a cycle whose consumer releases before the sibling (contract-bootstrap.yml)'
      staging-bootstrap:
        type: boolean
        default: false
        description: 'With staged or staging: a staging channel never published (its index and key both 404) is skipped with a notice instead of failing the build. Only for the first layer of a wave, whose build runs before anything was staged.'
      matrix:
        type: string
        default: ''
        description: "'quick' builds the quick set alone (fc45 x86_64 rpm, trixie arm64 deb: .github/actions/release-matrix/quick.txt), 'full' the whole matrix. Empty: a release (a tag, source-ref) builds what the organisation variable OMX_RELEASE_MATRIX says and the full matrix without it; a staged run and a workflow_dispatch build what it says and the quick set without it; any other run the full matrix."
      stage:
        type: string
        default: 'all'
        description: 'all builds and publishes; build stops before the publish, leaving the packages as artifacts of the run; publish publishes the artifacts a build stage of the same run left, without building. release-c-lib.yml builds both kinds, runs channel-installability over them, and only then publishes either'
      same-pass:
        type: string
        default: ''
        description: 'Packages other repositories release in the same pass, space separated: a breakage of the channel they cause or suffer is reported, not red (channel-installability)'
      target-repo:
        type: string
        default: 'Open-Mixer/open-mixer.github.io'
        description: 'Pages repository whose deb/ tree receives the packages'
      base-url:
        type: string
        default: 'https://www.openmixer.org'
        description: 'Where the target repository is served'
      arch-matrix:
        type: string
        default: '["amd64", "arm64"]'
        description: 'JSON array of architectures, each built natively'
      suite-matrix:
        type: string
        default: '["trixie"]'
        description: 'JSON array of Debian releases (trixie: Raspberry Pi OS and Zynthian)'
      dependencies:
        type: string
        default: 'mod-host-protocol clap-headers'
        description: 'What to build first (actions/deb-deps), space separated'
      requires:
        type: string
        default: 'libmod-host-protocol0'
        description: 'Packages the apt tree must already serve before this one is published'
      build-packages:
        type: string
        default: ''
        description: 'Extra distribution packages installed before the build, space separated'
      channel-deps:
        type: boolean
        default: true
        description: 'Take Build-Depends Debian does not carry (plugin-hostd-dev) from the channel at base-url'
      changelog-spec:
        type: string
        default: ''
        description: 'Ignored, kept so existing callers still validate: no CHANGELOG.md check remains'
      bump-exempt:
        type: string
        default: 'docs/** **/*.md .github/**'
        description: 'Globs, space separated, of paths that change no package: a pull request into devel that changes any other path while its version is published already is refused (a merge to devel of a published version publishes nothing)'
      source-repository:
        type: string
        default: ''
        description: 'Repository to build when it is not the caller (a release dispatched from another repository); empty means the caller'
      source-ref:
        type: string
        default: ''
        description: 'Tag of source-repository to build and release, v<version>; empty means the tag the caller was run on'
      source-sha:
        description: 'With source-ref: the commit that tag must resolve to; each checkout is asserted against it. Empty skips the check.'
        required: false
        type: string
        default: ''
      create-github-release:
        type: boolean
        default: true
        description: 'Attach the DEBs, named by Debian release, to the GitHub release of the tag'
      catch-up:
        type: boolean
        default: false
        description: 'With source-ref (or on the tag): build and publish only the cells of the set that the version, already served, lacks in the channel''s cells.tsv; nothing missing builds nothing. Refuses a version the channel does not serve, a cell some of its packages serve and others lack, and republish. The publish drops the arch-independent packages the channel serves and refuses to write any other file it holds (docs/release-operations.md, "Catching a served version up")'
      republish:
        type: boolean
        default: false
        description: 'Let the release go out over a version the channel already serves. Off, the preflight refuses it (a moved old tag re-running its release); on only to finish a partial publish.'
      enabled:
        type: boolean
        default: true
        description: 'false: this source ships no Debian package. Every job of the workflow is skipped (the preflight is, and every other job needs it), nothing is built, published or checked, and what the channel already serves stays. The caller declares it here, in the one place its release workflow passes to this one; the debian/ directory stays.'
      verify-install:
        type: boolean
        default: true
        description: 'After a publish, install the new version from the channel in a clean container of each release. false skips the check: the release is then not proven installable, and the worker image dispatch goes out on the publish alone.'
      dispatch-repo:
        type: string
        default: ''
        description: 'Repository whose worker image build is told about the new packages by a repository_dispatch, else the OMX_DISPATCH_REPO variable; neither sends nothing'
      dispatch-event:
        type: string
        default: 'openmixer-package-published'
        description: 'event_type of that repository_dispatch; the worker image build listens for it (client_payload: package, tag, format)'
      release-package:
        type: string
        default: openmixer-release
        description: "The release package that adds the channel's repository to a build container: openmixer-release, or freereac-release for FreeREAC's channel"
      key-file:
        type: string
        default: ''
        description: "The name of the public key file the channel serves in its deb/ tree; empty means openmixer.asc, OpenMixer's. FreeREAC's channel passes its own (docs/channel-by-input.md)"
      committed-keys:
        type: boolean
        default: true
        description: "false keeps the public keys committed in this repository, which are OpenMixer's, out of the channel's key file: another project's channel serves exactly the key it signs with"
      signing-fingerprint:
        type: string
        default: ''
        description: "The primary fingerprint the signing key must have; a secret mapped to another channel's key refuses the run before anything is signed. Empty checks none"
      label:
        type: string
        default: ''
        description: "The Origin and Label of the real channel's Release files; empty means OpenMixer"
    secrets:
      DISPATCH_TOKEN:
        required: false
      OPENMIXER_PACKAGES_SIGNING_KEY:
        required: false
      RPM_GPG_KEY:
        required: false
      RPM_GPG_PASSPHRASE:
        required: false
      PACKAGES_SIGNING_PASSPHRASE:
        required: false
      PAGES_TOKEN:
        required: false
      SITE_GPG_KEY:
        required: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Check the release can publish
    if: ${{ inputs.enabled }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    outputs:
      set: ${{ steps.matrix.outputs.set }}
      releases: ${{ steps.matrix.outputs.releases }}
      cells: ${{ steps.matrix.outputs.cells }}
      first-arch: ${{ steps.matrix.outputs.first-arch }}
      count: ${{ steps.matrix.outputs.count }}
      # the version a merge to devel publishes, empty for every other run (.github#289)
      devel-version: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/devel') && steps.devel.outputs.version || '' }}
      # 'true' when a merge to devel carries a version published already: nothing is built or published, and the run is
      # green with a notice (release-preflight); the pull request into devel is where the missing bump is red
      skip: ${{ steps.preflight.outputs.skip }}
    steps:
      # the cells this run builds and checks: the quick set or the full matrix (docs/release-operations.md)
      - id: matrix
        uses: Open-Mixer/.github/.github/actions/release-matrix@openmixer-v1
        with:
          kind: deb
          # a merge to devel builds every cell: promotion copies that one build to the channel root (.github#289)
          matrix: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/devel') && 'full' || inputs.matrix }}
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          staged: ${{ (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
          source-ref: ${{ inputs.source-ref }}
          releases: ${{ inputs.suite-matrix }}
          arches: ${{ inputs.arch-matrix }}
          # a catch-up builds only the cells the version of the tag lacks in the channel
          catch-up: ${{ inputs.catch-up }}
          names: ${{ inputs.binary-names || inputs.package-name }}
          channel: ${{ inputs.target-repo }}
          token: ${{ secrets.PAGES_TOKEN }}

      # what is staged is never a release: a tag, source-ref or publish builds the release, against the real channel only;
      # a staged run publishes to the staging channel alone, the commit it runs on, of the calling repository
      - name: A staged run publishes to staging only, and staging never builds a release
        if: (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) || inputs.staging
        env:
          STAGED: ${{ (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
          STAGING: ${{ inputs.staging }}
          PUBLISH: ${{ inputs.publish }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_REF: ${{ inputs.source-ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          no() { echo "::error::$*"; exit 1; }
          [ "$REF_TYPE" != tag ] || no "staged and staging are for a manual run from a branch, never a tag: a tag builds the release, against the real channel alone"
          [ -z "$SOURCE_REF" ] || no "staged and staging take no source-ref: source-ref builds a release of a tag, against the real channel alone"
          [ "$PUBLISH" != true ] || no "staged and staging exclude publish: a staged run publishes to the staging channel only, and a release never builds against it"
          [ "$STAGED" != true ] || [ -z "$SOURCE_REPOSITORY" ] || no "a staged run builds the calling repository only"

      # bootstrap: each entry names one sibling commit in full; bootstrap-only releases exactly one such package, of the
      # version source-ref names, against the real channel, from the sibling's source and not this repository's
      - name: Read the bootstrap
        if: inputs.bootstrap != '' || inputs.bootstrap-only
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          ONLY: ${{ inputs.bootstrap-only }}
          NAME: ${{ inputs.package-name }}
          SOURCE_REF: ${{ inputs.source-ref }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          STAGED: ${{ (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
          STAGING: ${{ inputs.staging }}
        run: |
          no() { echo "::error::$*"; exit 1; }
          re='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}:[A-Za-z0-9][A-Za-z0-9._+-]*-contract$'
          n=0
          for e in $BOOTSTRAP; do
            [[ $e =~ $re ]] || no "bootstrap entry '$e' is not <owner>/<repo>@<full 40-character commit>:<package>-contract"
            n=$((n + 1)) pkg=${e##*:}
          done
          [ "$ONLY" != true ] || {
            [ "$n" -eq 1 ] || no "bootstrap-only releases ONE bootstrap package, and bootstrap names $n"
            [ "$pkg" = "$NAME" ] || no "bootstrap-only: package-name is $NAME, the bootstrap package is $pkg"
            [ "$STAGED" != true ] && [ "$STAGING" != true ] || no "bootstrap-only is a release against the real channel: not staged or staging"
            [ -z "$SOURCE_REPOSITORY" ] || no "bootstrap-only builds the commit its entry names: no source-repository"
            [[ $SOURCE_REF =~ ^v[0-9] ]] || no "bootstrap-only needs source-ref v<version>, the version of the package it releases"
          }

      - name: Read the stage
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          case $STAGE in all|build|publish) ;; *) echo "::error::stage is all, build or publish, not '$STAGE'"; exit 1 ;; esac

      # git history is the changelog: nothing here reads a CHANGELOG.md
      - uses: actions/checkout@v4
        if: ${{ !inputs.bootstrap-only }}
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.source-repository == '' }}

      - name: Check the checkout is the verified commit
        if: inputs.source-sha != '' && !inputs.bootstrap-only
        env:
          WANT: ${{ inputs.source-sha }}
        run: |
          got=$(git -c safe.directory="$PWD" rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::the checkout is $got but the verified tag resolved to $WANT"; exit 1; }

      # a merge to devel publishes the real package, built once: the version it carries must be published nowhere yet,
      # neither in the channel root nor in staging; a staged dispatch snapshots it, and a version published as a real build
      # is no longer snapshotted (.github#289)
      - name: The version a merge to devel publishes, or a staged run snapshots
        id: devel
        if: (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel') || (startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel'))
        # dpkg-parsechangelog reads it, without the Debian revision: the version a tag and a file name carry (tree-version.sh)
        uses: Open-Mixer/.github/.github/actions/tree-version@openmixer-v1
        with:
          kind: deb

      # a pull request into devel that changes a package while its version is published already is refused by name: its
      # merge would publish nothing. The public channel is read with the run's own token (.github#289)
      - name: A pull request into devel that changes a package carries its version bump
        if: (startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel')
        uses: Open-Mixer/.github/.github/actions/devel-bump-check@openmixer-v1
        with:
          kind: deb
          version: ${{ steps.devel.outputs.version }}
          base: ${{ github.event.pull_request.base.sha }}
          packages: ${{ inputs.binary-names || inputs.package-name }}
          releases: ${{ steps.matrix.outputs.releases }}
          exempt: ${{ inputs.bump-exempt }}
          target: ${{ inputs.target-repo }}
          token: ${{ github.token }}

      # a staged run publishes too (to the staging channel): its secrets and target are checked, never a tag
      - id: preflight
        uses: Open-Mixer/.github/.github/actions/release-preflight@openmixer-v1
        with:
          publish: ${{ inputs.publish || (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
          require-tag: ${{ !(inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
          tag: ${{ inputs.source-ref }}
          target: ${{ inputs.target-repo }}
          packages: ${{ inputs.binary-names || inputs.package-name }}
          republish: ${{ inputs.republish }}
          catch-up: ${{ inputs.catch-up }}
          kind: deb
          devel-version: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/devel') && steps.devel.outputs.version || '' }}
          # a dispatched staged run: refused when the channel root or staging holds a real build of its version
          staged-version: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/devel') && inputs.staged && steps.devel.outputs.version || '' }}
          # the already-served check reads the releases this run publishes into, no others
          releases: ${{ steps.matrix.outputs.releases }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: preflight
    # a catch-up of a version served in every cell plans nothing: no build, no publish, and the first job said so
    # a merge to devel of a version published already builds nothing (needs.preflight.outputs.skip, release-preflight)
    if: inputs.stage != 'publish' && needs.preflight.outputs.count != '0' && needs.preflight.outputs.skip != 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner || 'ubuntu-latest' }}
    # a library whose package build runs its whole test suite (omx-dsp: the oracles at nine rates) takes 31 to 45
    # minutes on a hosted runner; 45 cancelled two omx-dsp releases (v0.23.0, v0.24.0), so the bound is 90
    timeout-minutes: 90
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.cells) }}
    env:
      RELEASE_TAG: ${{ inputs.source-ref || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - name: Install the build tools
        env:
          EXTRA: ${{ inputs.build-packages }}
        run: |
          apt-get update -qq
          # shellcheck disable=SC2086 # EXTRA is a list of package names, split on purpose
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian python3 $EXTRA

      - uses: actions/checkout@v4
        if: ${{ !inputs.bootstrap-only }}
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.source-repository == '' }}

      - name: Check the checkout is the verified commit
        if: inputs.source-sha != '' && !inputs.bootstrap-only
        env:
          WANT: ${{ inputs.source-sha }}
        run: |
          got=$(git -c safe.directory="$PWD" rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::the checkout is $got but the verified tag resolved to $WANT"; exit 1; }

      - uses: Open-Mixer/.github/.github/actions/deb-deps@openmixer-v1
        if: ${{ !inputs.bootstrap-only }}
        with:
          names: ${{ inputs.dependencies }}

      # for the build only: the source exists in this container and is never a dependency of a release
      # staged or staging: the staging channel beside it, at a higher priority, so the build takes what the wave staged
      # a pull request into devel: add-openmixer itself adds the staging channel and refuses an absent one by name
      # (devel -> staging -> prod); the step runs for it whatever channel-deps says
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        if: inputs.channel-deps || (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) || inputs.staging || (startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel' && inputs.release-package == 'openmixer-release')
        with:
          base-url: ${{ inputs.base-url }}
          release-package: ${{ inputs.release-package }}
          staging: ${{ (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) || inputs.staging }}
          staging-bootstrap: ${{ inputs.staging-bootstrap }}

      # a staged snapshot or a dry run (a run not at a release tag) is <version>+git<commit time>.<sha>, above the release, so it meets a consumer's (>= <version>)
      # floor, above the staged build of any earlier commit, and is not pruned behind a published <version> by the installability gate
      # bootstrap (Open-Mixer/.github#230): a sibling's -contract data packages, each built alone at its named commit;
      # installed here for the build and never released, or, with bootstrap-only, the release itself
      # a pull request into devel builds its own repository only: the lower layers are the staging channel's published
      # packages (add-openmixer added it), never rebuilt from source, so no bootstrap runs for it
      - uses: Open-Mixer/.github/.github/actions/contract-bootstrap@openmixer-v1
        if: inputs.bootstrap != '' && !(startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel')
        with:
          kind: deb
          entries: ${{ inputs.bootstrap }}
          out: ${{ inputs.bootstrap-only && 'debs' || 'bootstrap' }}
          install: ${{ !inputs.bootstrap-only }}

      - name: The bootstrap package is the version the release names
        if: inputs.bootstrap-only
        env:
          NAME: ${{ inputs.package-name }}
        run: |
          set -euo pipefail
          v=$(dpkg-deb -f debs/"${NAME}"_*_all.deb Version)
          [ "v${v%%~git*}" = "$RELEASE_TAG" ] || { echo "::error::the bootstrap package is $NAME $v, and the release is $RELEASE_TAG"; exit 1; }

      - uses: Open-Mixer/.github/.github/actions/build-deb@openmixer-v1
        if: ${{ !inputs.bootstrap-only }}
        with:
          max-jobs: ${{ vars.OMX_RUNNER_CPUS || '3' }}
          tag: ${{ env.RELEASE_TAG }}
          # a merge to devel: the real version, built once (.github#289)
          real: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/devel') }}
          staged: ${{ (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
          dry-run: ${{ env.RELEASE_TAG == '' }}

      # the full matrix never goes out on top of a version the channel has for the quick set alone: the cells the
      # dependency lacks could not install what this release publishes (docs/release-operations.md)
      - uses: Open-Mixer/.github/.github/actions/quick-deps@openmixer-v1
        if: needs.preflight.outputs.set == 'full' && inputs.publish && inputs.channel-deps && env.RELEASE_TAG != ''
        with:
          kind: deb
          base-url: ${{ inputs.base-url }}

      - name: Refuse an empty build, and one of another architecture
        env:
          ARCH: ${{ matrix.arch }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
        run: |
          find debs -name '*.deb' | sort | tee built.txt
          test -s built.txt || { echo "::error::no DEB was produced"; exit 1; }
          # the binaries are named after the source package unless binary-names says otherwise
          for bin in ${BINARIES:-$NAME}; do
            bins=$(find debs \( -name "${bin}_*_$ARCH.deb" -o -name "${bin}_*_all.deb" \) | wc -l)
            [ "$bins" -gt 0 ] || { echo "::error::no $bin DEB for $ARCH"; exit 1; }
          done

      # the dependencies are built to satisfy Build-Depends; only this package is released
      - name: Lay the package out by Debian release
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p "out/$SUITE"
          cp debs/*.deb "out/$SUITE/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: out
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish || (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))) && 30 || 2 }}

  publish-go:
    name: Release publish gate
    needs: [preflight, build]
    # the conditions of the publish stage live here, so that the job which signs and pushes can carry the tag condition alone
    if: ${{ !cancelled() && inputs.stage != 'build' && needs.preflight.result == 'success' && needs.preflight.outputs.count != '0' && (needs.build.result == 'success' || (inputs.stage == 'publish' && needs.build.result == 'skipped')) && inputs.publish && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "the release publish of this stage may run"

  publish-release:
    name: Sign and publish
    needs: [preflight, publish-go]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: debian:trixie
    # one group per target serialises this organisation's runs: the tree is shared by every package
    concurrency:
      group: publish-${{ inputs.target-repo }}-live
      cancel-in-progress: false
    env:
      DO_PUBLISH: 'true'
    steps:
      # <suite>-<arch> only: artifacts outlive their attempt, and the published copies an earlier attempt uploaded
      # as -debs-signed are flat, which publish-tree.sh refuses (tests/deb-rerun-layout.sh)
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.package-name }}-debs-*-*
          merge-multiple: true
          path: collected

      - id: publish
        uses: Open-Mixer/.github/.github/actions/publish-debs@openmixer-v1
        with:
          # the channel's own deb/ tree, read by a dry run's installability check (the action's default is OpenMixer's)
          served-url: ${{ inputs.base-url }}/deb
          # ... and its release package, whose sources name the Debian releases the check judges (.github#279)
          release-package: ${{ inputs.release-package }}
          same-pass: ${{ inputs.same-pass }}
          deb-dir: collected
          tag: ${{ inputs.source-ref || github.ref_name }}
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          key-file: ${{ inputs.key-file }}
          committed-keys: ${{ inputs.committed-keys }}
          signing-fingerprint: ${{ inputs.signing-fingerprint }}
          label: ${{ inputs.label }}
          gpg-passphrase: ${{ secrets.PACKAGES_SIGNING_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          requires: ${{ inputs.requires }}
          changelogs-url: ${{ inputs.base-url }}/deb/changelogs
          staging: 'false'
          # a catch-up adds cells to a version: cells.tsv keeps the set the version was published for
          matrix-set: ${{ !inputs.catch-up && needs.preflight.outputs.set || '' }}
          catch-up: ${{ inputs.catch-up }}
          suites: ${{ needs.preflight.outputs.releases }}


      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-debs-signed
          path: signed/*.deb
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish || (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))) && 30 || 2 }}

  publish:
    name: Stage the build, or assemble the unsigned tree (a release is publish-release)
    needs: [preflight, build]
    # the publish stage takes the packages a build stage of this run left; channel-installability inside the
    # publish action refuses a release that would leave a package of the channel uninstallable
    if: ${{ !cancelled() && inputs.stage != 'build' && needs.preflight.result == 'success' && needs.preflight.outputs.count != '0' && needs.preflight.outputs.skip != 'true' && (needs.build.result == 'success' || (inputs.stage == 'publish' && needs.build.result == 'skipped')) && !(inputs.publish && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
    outputs:
      commit: ${{ steps.staged.outputs.commit }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: debian:trixie
    # A dry run (publish false) pushes nothing, so it gets its own group per run.
    # A merge to devel has a group per calling repository and kind: it never waits behind, or holds back, another
    # repository's release, and the channel push repeats a lost race on the new tip. GitHub keeps one run pending per
    # group and cancels the older pending one when a third arrives (docs/release-operations.md).
    concurrency:
      group: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/devel') && format('devel-publish-{0}-deb', github.repository) || format('publish-{0}-{1}', inputs.target-repo, inputs.staged && 'live' || github.run_id) }}
      cancel-in-progress: false
    steps:
      # <suite>-<arch> only: artifacts outlive their attempt, and the published copies an earlier attempt uploaded
      # as -debs-signed are flat, which publish-tree.sh refuses (tests/deb-rerun-layout.sh)
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.package-name }}-debs-*-*
          merge-multiple: true
          path: collected

      - id: staged
        if: (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))
        uses: Open-Mixer/.github/.github/actions/publish-debs@openmixer-v1
        with:
          # the channel's own deb/ tree, read by a dry run's installability check (the action's default is OpenMixer's)
          served-url: ${{ inputs.base-url }}/deb
          # ... and its release package, whose sources name the Debian releases the check judges (.github#279)
          release-package: ${{ inputs.release-package }}
          same-pass: ${{ inputs.same-pass }}
          deb-dir: collected
          tag: ${{ format('staged {0}', github.sha) }}
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          key-file: ${{ inputs.key-file }}
          committed-keys: ${{ inputs.committed-keys }}
          signing-fingerprint: ${{ inputs.signing-fingerprint }}
          label: ${{ inputs.label }}
          gpg-passphrase: ${{ secrets.PACKAGES_SIGNING_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          requires: ${{ inputs.requires }}
          changelogs-url: ${{ inputs.base-url }}/${{ (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) && 'staging/deb' || 'deb' }}/changelogs
          staging: 'true'
          # a merge to devel refuses, by name, a file the channel holds already, never keeps it (.github#289)
          refuse-served: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/devel') }}
          # a catch-up adds cells to a version: cells.tsv keeps the set the version was published for
          matrix-set: ${{ !inputs.catch-up && needs.preflight.outputs.set || '' }}
          catch-up: ${{ inputs.catch-up }}
          suites: ${{ needs.preflight.outputs.releases }}


      - id: dry
        if: ${{ !(inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
        uses: Open-Mixer/.github/.github/actions/publish-debs@openmixer-v1
        with:
          # the channel's own deb/ tree, read by a dry run's installability check (the action's default is OpenMixer's)
          served-url: ${{ inputs.base-url }}/deb
          # ... and its release package, whose sources name the Debian releases the check judges (.github#279)
          release-package: ${{ inputs.release-package }}
          same-pass: ${{ inputs.same-pass }}
          deb-dir: collected
          tag: ${{ inputs.source-ref || github.ref_name }}
          sign: 'false'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          key-file: ${{ inputs.key-file }}
          committed-keys: ${{ inputs.committed-keys }}
          signing-fingerprint: ${{ inputs.signing-fingerprint }}
          label: ${{ inputs.label }}
          gpg-passphrase: ${{ secrets.PACKAGES_SIGNING_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          requires: ${{ inputs.requires }}
          changelogs-url: ${{ inputs.base-url }}/deb/changelogs
          staging: 'false'
          # a catch-up adds cells to a version: cells.tsv keeps the set the version was published for
          matrix-set: ${{ !inputs.catch-up && needs.preflight.outputs.set || '' }}
          catch-up: ${{ inputs.catch-up }}
          suites: ${{ needs.preflight.outputs.releases }}


      - uses: actions/upload-artifact@v4
        if: (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))
        with:
          name: ${{ inputs.package-name }}-debs-signed
          path: signed/*.deb
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish || (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))) && 30 || 2 }}

      - uses: actions/upload-artifact@v4
        if: ${{ !(inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
        with:
          name: ${{ inputs.package-name }}-unsigned-apt-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish || (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))) && 30 || 2 }}

      - name: Report a dry run honestly
        if: ${{ !(inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
        run: |
          echo "::warning::dry run: nothing was signed or published. The unsigned tree is attached to this run."

  # Runs beside build-rpm.yml's release job, which may create the release first: create it only when it
  # is absent, otherwise upload with --clobber. File names repeat across Debian releases, so the release
  # is part of the asset name.

  release:
    name: GitHub release
    needs: publish-release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # the release notes are the commit subjects since the previous tag, not GitHub's list of merged pull requests
      - uses: actions/checkout@v4
        if: ${{ inputs.publish && inputs.create-github-release }}
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: Open-Mixer/.github/.github/actions/changelog@openmixer-v1
        if: ${{ inputs.publish && inputs.create-github-release }}
        with:
          mode: notes
          tag: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md

      - uses: actions/download-artifact@v4
        if: ${{ inputs.publish && inputs.create-github-release }}
        with:
          pattern: ${{ inputs.package-name }}-debs-*-*
          merge-multiple: true
          path: collected

      - name: Attach the DEBs to the release
        if: ${{ inputs.publish && inputs.create-github-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          for deb in collected/*/*.deb; do
            suite=$(basename "$(dirname "$deb")")
            base=$(basename "$deb" .deb)
            arch=${base##*_}
            cp "$deb" "assets/${base%_*}_${suite}_${arch}.deb"
          done
          ls -l assets
          test -n "$(ls assets)" || { echo "::error::no DEB to attach"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          elif gh release create "$TAG" assets/*.deb --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"; then
            :
          else
            # lost the race to the RPM job
            gh release upload "$TAG" assets/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # Pages deploys the pushed commit on its own time, and five releases in a row make it slow. The wait is a job
  # of its own so a slow deployment never fails the publish or holds back the GitHub release, whose assets come
  # from the built files. It reads the Pages deployment status of the commit and fails, naming the deployment,
  # after 30 minutes.
  live:
    name: Pages deployment
    needs: [publish, publish-release]
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish-release.result == 'success') && (needs.publish.outputs.commit || needs.publish-release.outputs.commit) != '' }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: Open-Mixer/.github/.github/actions/pages-live@openmixer-v1
        with:
          channel: ${{ inputs.target-repo }}
          commit: ${{ needs.publish.outputs.commit || needs.publish-release.outputs.commit }}
          token: ${{ secrets.PAGES_TOKEN }}

  # The last proof: the version the tag names installs from the channel, in a Debian that holds nothing else.
  # Pages serves the push a little late, so the check retries before it calls the release broken. A staged run checks
  # every target the same way, with the staging channel added: the build of this commit installs, from staging.
  verify:
    name: Install check (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: [preflight, publish, publish-release, release, live]
    if: ${{ !cancelled() && needs.preflight.outputs.skip != 'true' && (needs.publish.result == 'success' || needs.publish-release.result == 'success') && inputs.verify-install && ((inputs.publish && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) || (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.cells) }}
    steps:
      # the real channel alone for a release; with the staging channel for a staged run
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          base-url: ${{ inputs.base-url }}
          release-package: ${{ inputs.release-package }}
          staging: ${{ (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}

      - name: Install the new version from the channel
        if: ${{ !(inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}
        env:
          TAG: ${{ inputs.source-ref || github.ref_name }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
          URL: ${{ inputs.base-url }}/deb
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          ver=${TAG#v}
          for bin in ${BINARIES:-$NAME}; do
            ok=
            for try in $(seq 1 20); do
              apt-get update -qq || true
              # the exact version the tag names (Debian revision and ~/+ suffixes allowed), never the newest
              pinned=$(apt-cache madison "$bin" | awk -v v="$ver" '$3 ~ "^"v"[-~+]" || $3 == v {print $3; exit}')
              if [ -n "$pinned" ] && apt-get install -y --no-install-recommends "$bin=$pinned"; then
                dpkg-query -W -f='${Package} ${Version}\n' "$bin" | tee /dev/stderr
                ok=1; break
              fi
              echo "attempt $try: $bin $ver is not installable yet"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$bin $ver does not install from $URL in a clean debian $SUITE"; exit 1; }
          done

      - name: Install the staged build of this commit from the staging channel
        if: (inputs.staged || (github.event_name == 'push' && github.ref == 'refs/heads/devel'))
        env:
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
          URL: ${{ inputs.base-url }}/staging/deb
          SUITE: ${{ matrix.suite }}
          DEVEL_VERSION: ${{ needs.preflight.outputs.devel-version }}
        run: |
          set -o pipefail
          for bin in ${BINARIES:-$NAME}; do
            ok=
            for try in $(seq 1 20); do
              apt-get update -qq || true
              # the candidate is the staged build of this commit: <version>+git<commit time>.<short sha> for a staged
              # dispatch, the real <version> itself for a merge to devel (built once, .github#289), pinned from staging
              cand=$(apt-cache policy "$bin" | awk '/Candidate:/ {print $2}')
              short=$(printf '%s\n' "$cand" | sed -n 's/.*+git[0-9]\{1,\}\.\([0-9a-f]\{7,\}\).*/\1/p')
              if [ -n "$DEVEL_VERSION" ]; then mine=$([ "$cand" = "$DEVEL_VERSION" ] && echo 1)
              else mine=$([ -n "$short" ] && [ "${GITHUB_SHA#"$short"}" != "$GITHUB_SHA" ] && echo 1); fi
              if [ -n "$mine" ] && apt-get install -y --no-install-recommends "$bin=$cand"; then
                dpkg-query -W -f='${Package} ${Version}\n' "$bin" | tee /dev/stderr
                ok=1; break
              fi
              echo "attempt $try: the staged $bin of $GITHUB_SHA is not the candidate yet (candidate: ${cand:-none})"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::the staged $bin of $GITHUB_SHA does not install from $URL in a clean debian $SUITE"; exit 1; }
            apt-cache policy "$bin" | grep -B1 -A1 'staging/deb' || true
          done

  # A tag that ends without packages must not be silent: the repository gets an issue naming the tag and the
  # failed jobs. A called workflow cannot raise the token of its caller: the `permissions` below only narrow it.
  # The calling release.yml must itself grant `issues: write` in its top-level `permissions:` (or on the job that
  # calls this workflow). Without it the step fails loudly with an error naming the missing permission.
  report-failure:
    name: Report a failed release
    needs: [preflight, build, publish-go, publish, publish-release, release, live, verify]
    if: ${{ always() && inputs.publish && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - uses: Open-Mixer/.github/.github/actions/release-failure-issue@openmixer-v1
        with:
          tag: ${{ inputs.source-ref || github.ref_name }}
          token: ${{ github.token }}
          workflow: build-deb

  # Last: tell the worker image build that the channel holds a new version. Nothing listens for the event yet,
  # so this job may not fail the release (continue-on-error) and says so in its notice when it has no token.
  # Token: DISPATCH_TOKEN, an organisation secret that may dispatch events to dispatch-repo. PAGES_TOKEN is
  # used only when DISPATCH_TOKEN is unset, and the notice says so: its scope is not recorded, so a 403 there
  # is expected and not a release failure. With verify-install false the install check is skipped and the
  # dispatch still goes out once the publish succeeded.
  notify-go:
    name: Worker image gate
    needs: [publish-release, verify]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && inputs.publish && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && (inputs.dispatch-repo != '' || vars.OMX_DISPATCH_REPO != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "the worker image build may be told"

  notify-worker-image:
    name: Tell the worker image build
    needs: [notify-go]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Send the repository_dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          TARGET: ${{ inputs.dispatch-repo || vars.OMX_DISPATCH_REPO }}
          EVENT: ${{ inputs.dispatch-event }}
          PACKAGE: ${{ inputs.package-name }}
          TAG: ${{ inputs.source-ref || github.ref_name }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            export GH_TOKEN="$DISPATCH_TOKEN"
          elif [ -n "$PAGES_TOKEN" ]; then
            export GH_TOKEN="$PAGES_TOKEN"
            echo "::notice::DISPATCH_TOKEN is not set; trying PAGES_TOKEN, whose scope on $TARGET is not recorded. Set DISPATCH_TOKEN to make this reliable."
          else
            echo "::notice::no DISPATCH_TOKEN (and no PAGES_TOKEN): the worker image build was not told about $PACKAGE $TAG"
            exit 0
          fi
          gh api "repos/$TARGET/dispatches" -f event_type="$EVENT" \
            -f "client_payload[package]=$PACKAGE" -f "client_payload[tag]=$TAG" -f "client_payload[format]=deb" \
            -f "client_payload[source]=$GITHUB_REPOSITORY"
          echo "sent $EVENT to $TARGET for $PACKAGE $TAG"
