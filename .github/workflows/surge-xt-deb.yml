name: Surge XT DEBs

# Builds surge-xt, surge-xt-data, surge-xt-clap and surge-xt-lv2, which Debian does not package, from
# .github/actions/deb-deps/surge-xt at the commit of .github/pins.txt (packaging/surge-xt/make-source.sh lays out the
# source with its submodules), for every Debian release and architecture, installs the result in a clean container
# with omx-clap-host from the channel and loads it there (packaging/surge-xt/load-check.sh), and publishes it into
# deb/ of the Pages repository. Released by a tag, once per change: a published version is never rebuilt with new bytes.
#
# A push of a tag `surge-xt-*` publishes; a run by hand is a dry run: it builds and assembles an unsigned tree as an
# artifact and signs and pushes nothing (docs/release-operations.md, "Publish only by tagging").

on:
  push:
    tags: ['surge-xt-*']
  workflow_dispatch:
    inputs:
      matrix:
        description: "'quick' builds the quick set alone, 'full' the whole matrix; empty: what the organisation variable OMX_RELEASE_MATRIX says, and the quick set without it (.github/actions/release-matrix/quick.txt)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-preflight
        with:
          publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          require-tag: 'false'
          target: Open-Mixer/open-mixer.github.io
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  # The cells this run builds, and what it skips: the quick set while OMX_RELEASE_MATRIX is quick, the whole matrix with
  # full (ruling D25, docs/release-operations.md). The build set, so release-matrix; the whole matrix, written once here; quick.txt cuts it while a wave is quick.
  plan:
    name: Plan the cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
      releases: ${{ steps.matrix.outputs.releases }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        uses: ./.github/actions/release-matrix
        with:
          kind: deb
          matrix: ${{ inputs.matrix }}
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          releases: '["trixie"]'
          arches: '["amd64", "arm64"]'

  build:
    name: Build (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: [preflight, plan]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4

      - uses: ./.github/actions/deb-deps
        with:
          names: surge-xt

      - name: Lay the packages out by Debian release
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p "out/$SUITE"
          cp dep-debs/surge-xt*.deb "out/$SUITE/"
          dpkg-deb -c dep-debs/surge-xt-clap_*.deb | grep -q ' ./usr/lib/clap/Surge XT.clap$' \
            || { echo "::error::surge-xt-clap does not carry /usr/lib/clap/Surge XT.clap"; exit 1; }
          dpkg-deb -c dep-debs/surge-xt-lv2_*.deb | grep -q ' ./usr/lib/lv2/Surge XT.lv2/$' \
            || { echo "::error::surge-xt-lv2 does not carry /usr/lib/lv2/Surge XT.lv2"; exit 1; }
          if dpkg-deb -c dep-debs/surge-xt*.deb | grep -q ' ./usr/local'; then echo "::error::a package carries /usr/local"; exit 1; fi

      - uses: ./.github/actions/add-openmixer

      - name: Load the plugin in the hosts' scanners
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends omx-clap-host lilv-utils
          apt-get install -y --no-install-recommends ./dep-debs/surge-xt*.deb
          packaging/surge-xt/load-check.sh /

      - uses: actions/upload-artifact@v4
        with:
          name: surge-xt-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: out
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 30 || 2 }}

  publish:
    name: Sign and publish
    needs: [plan, build]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    concurrency:
      group: publish-Open-Mixer/open-mixer.github.io
      cancel-in-progress: false
    env:
      DO_PUBLISH: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: surge-xt-debs-*
          merge-multiple: true
          path: collected

      - uses: ./.github/actions/publish-debs
        with:
          deb-dir: collected
          tag: surge-xt
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          # the original key co-signs the apt index while installs may hold only it (publish-debs)
          cosign-key: ${{ secrets.RPM_GPG_KEY }}
          cosign-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}


  publish-dry-run:
    name: Assemble the unsigned tree, nothing is published
    needs: [plan, build]
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    env:
      DO_PUBLISH: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: surge-xt-debs-*
          merge-multiple: true
          path: collected

      - uses: ./.github/actions/publish-debs
        with:
          deb-dir: collected
          tag: surge-xt
          sign: 'false'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          # the original key co-signs the apt index while installs may hold only it (publish-debs)
          cosign-key: ${{ secrets.RPM_GPG_KEY }}
          cosign-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: surge-xt-unsigned-apt-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 30 || 2 }}
