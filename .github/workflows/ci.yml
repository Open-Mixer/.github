name: ci

# The publish scripts and the key import, exercised the way a release uses them, with throwaway keys: a
# channel signed by one key, a second key served next to it, a publish signed by the second key, and a
# client that only ever held the first (tests/key-transition.sh); a package someone left in the channel is refused
# and never signed (tests/sign-only-placed.sh), and so is a key file whose keys the repository does not pin
# (tests/pinned-keys.sh). The changelog generator (from git), and
# what the channel publish adds from them: an updateinfo.xml for dnf and a Changelogs URL for apt
# (docs/packaging-changelog.md). The language packs of an owner and the openmixer meta packs build and install, and a
# listed language with no catalog or an owner with no pack is red (tests/langpacks.sh, docs/language-packs.md); the fill of a catalog's missing entries through a fixture router, and its refusals (tests/langpacks-fill.sh). The mod-host packages from the OpenMixer fork at its pin: its tests pass, each fix
# taken out again fails its check, and the RPMs and DEBs pass the installed-library checks and upgrade the
# channel's earlier builds (docs/mod-host.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-message-check:
    name: commit-message-check action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: tests/commit-message-check.sh
      - run: tests/preamble-actions.sh
      - run: tests/channel-keep-list.sh
      - run: tests/pinned-keys.sh
      - run: tests/install-clean-retry.sh
      - run: tests/quick-unbuilt-pass.sh
      - run: tests/reusable-workflows.sh
      - run: tests/arch-binary-names.sh
      - run: tests/runner-selection.sh
      - run: tests/release-checks.sh
      - run: tests/wave-deps.sh
      - run: tests/wave-deps-released.sh
      - run: tests/staging-channel.sh
      - run: tests/release-matrix.sh
      - run: tests/check-matrix.sh
      - run: tests/no-hardcoded-cells.sh
      - run: tests/promote-staged.sh
      - run: tests/release-preflight-served.sh
      - run: tests/catch-up-plan.sh
      - run: tests/bookworm-asan.sh
      - name: The layout check proves itself, then reads this repository
        run: |
          .github/actions/public-layout-check/check.sh --self-test
          .github/actions/public-layout-check/check.sh .
      - name: The action reads this pull request's own commits
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/commit-message-check

  key-transition:
    name: Key transition (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: rpm
            image: fedora:44
            tools: dnf install -y --setopt=install_weak_deps=False rpm-build rpm-sign createrepo_c python3-rpm gnupg2 pinentry findutils zstd diffutils
          - kind: deb
            image: debian:trixie
            tools: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv dpkg-dev
    steps:
      - name: Install the packaging tools
        run: ${{ matrix.tools }}

      - uses: actions/checkout@v4

      - name: Make two throwaway keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          tests/make-keys.sh "$RUNNER_TEMP/keys"
          for k in old new; do
            { echo "$k<<EOF_KEY"; cat "$RUNNER_TEMP/keys/$k.sec"; echo EOF_KEY; } >> "$GITHUB_OUTPUT"
          done

      - uses: ./.github/actions/import-gpg-key
        with:
          gpg-key: ${{ steps.keys.outputs.new }}
          id-variable: NEW_ID

      - uses: ./.github/actions/import-gpg-key
        with:
          gpg-key: ${{ steps.keys.outputs.old }}
          gpg-passphrase: old-pass
          id-variable: OLD_ID

      - name: Publish across the key change
        shell: bash
        run: tests/key-transition.sh ${{ matrix.kind }}

      - name: A package planted in the channel is refused, never signed
        shell: bash
        run: tests/sign-only-placed.sh ${{ matrix.kind }}

      - name: A catch-up publishes the missing cell and rewrites no served file
        shell: bash
        run: tests/catch-up-publish.sh ${{ matrix.kind }}

      - name: An all package pinned by its source is never published ahead of an architecture the run did not build
        if: matrix.kind == 'deb'
        shell: bash
        run: tests/arch-all-pin.sh

      - name: An all package pinned by a package the suite already serves is never published over it
        if: matrix.kind == 'deb'
        shell: bash
        run: tests/arch-all-served-pin.sh

      - name: A noarch package pinned by its source is never published ahead of an architecture the run did not build
        if: matrix.kind == 'rpm'
        shell: bash
        run: tests/noarch-pin.sh

  staging-publish:
    name: Staging channel, publish and purge (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: rpm
            image: fedora:44
            tools: dnf install -y --setopt=install_weak_deps=False rpm-build rpm-sign createrepo_c python3-rpm python3-pyyaml gnupg2 pinentry findutils git
          - kind: deb
            image: debian:trixie
            tools: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv dpkg-dev python3 python3-yaml git ca-certificates
    steps:
      - name: Install the packaging tools
        run: ${{ matrix.tools }}

      - uses: actions/checkout@v4

      # a throwaway key of its own; the client arm writes the container's /etc
      - name: A staged publish lands in staging only, a client prefers it, and the purge leaves the real tree untouched
        shell: bash
        run: tests/staging-publish.sh ${{ matrix.kind }}

      - name: A staged build is promoted to the channel root with the same bytes, and only when the release key vouches for it
        shell: bash
        run: tests/promote-publish.sh ${{ matrix.kind }}

  staging-bootstrap:
    name: First staged run into a channel with no staging path (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: rpm
            image: fedora:44
            tools: dnf install -y --setopt=install_weak_deps=False rpm-build rpm-sign createrepo_c python3-rpm python3-pyyaml gnupg2 pinentry findutils git curl
          - kind: deb
            image: debian:trixie
            tools: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv dpkg-dev python3 python3-yaml git ca-certificates curl
    steps:
      - name: Install the packaging tools
        run: ${{ matrix.tools }}

      - uses: actions/checkout@v4

      # the channel served over HTTP in the container, so a missing staging index is a real 404
      - name: The first staged run adds staging only once published, and its publish creates the staging index
        shell: bash
        run: tests/staging-bootstrap.sh ${{ matrix.kind }}

  staging-installability:
    name: channel-installability judges the real channel alone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False rpm-build createrepo_c dnf5-plugins python3 git findutils

      # the gate lives on main: the test reads it from origin/main when this tree does not carry it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A staged minor does not change the verdict
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tests/staging-installability.sh

  # The images the language packs are checked in: the cells the release set builds, no others while OMX_RELEASE_MATRIX
  # is quick (ruling D25); the whole list, bookworm among it, with full. check-matrix names what it skips.
  plan:
    name: plan the matrix checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        uses: ./.github/actions/check-matrix
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["44", "45"]'
          rpm-arches: '["x86_64"]'
          deb-releases: '["bookworm", "trixie"]'
          deb-arches: '["amd64"]'

  langpacks:
    name: language packs (${{ matrix.image }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Install the tools
        run: |
          if command -v dnf >/dev/null; then
            echo KIND=rpm >> "$GITHUB_ENV"
            dnf install -y --setopt=install_weak_deps=False rpm-build python3
          else
            echo KIND=deb >> "$GITHUB_ENV"
            apt-get update -qq && apt-get install -y --no-install-recommends build-essential dpkg-dev debhelper lintian python3
          fi
      - uses: actions/checkout@v4
      - run: tests/langpacks.sh "$KIND"

  channel-installability:
    name: channel installability (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: ceiling
            image: debian:trixie
            tools: apt-get update -qq && apt-get install -y --no-install-recommends python3
          - arm: deb
            image: debian:trixie
            tools: apt-get update -qq && apt-get install -y --no-install-recommends dose-distcheck python3 python3-yaml dpkg-dev
          - arm: rpm
            image: fedora:44
            tools: dnf install -y --setopt=install_weak_deps=False dnf5-plugins createrepo_c rpm-build python3 findutils
    steps:
      - run: ${{ matrix.tools }}
      - uses: actions/checkout@v4
      - run: tests/channel-installability.sh ${{ matrix.arm }}

  langpacks-fill:
    name: language packs fill (fixture router)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - name: The tools
        run: dnf install -y --setopt=install_weak_deps=False git nodejs python3 gnupg2 diffutils findutils
      - uses: actions/checkout@v4
      # an ordinary run reads the channel: the staging channel is for a run that is itself staged
      - name: omx-contract from the channel (3.16.0 or later, translate and the language list)
        uses: ./.github/actions/add-openmixer
      - run: dnf install -y --setopt=install_weak_deps=False 'omx-contract >= 3.16.0' 'omx-contract < 4'
      - run: tests/langpacks-fill.sh

  changelog:
    name: changelog generator from git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tests/changelog.sh

  updateinfo:
    name: dnf updateinfo from the packages' changelogs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False rpm-build createrepo_c python3-rpm dnf5 findutils
      - uses: actions/checkout@v4
      - run: tests/updateinfo.sh
      - run: tests/srpm-publish.sh
      - run: tests/every-arch-dir-repodata.sh

  build-rpm-same-bytes:
    name: two RPM builds of one commit give the same bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False rpm-build gcc git python3 findutils diffutils
      - uses: actions/checkout@v4
      - run: tests/build-rpm-same-bytes.sh

  deb-changelog:
    name: apt changelog from the published tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils dpkg-dev debhelper build-essential python3 apt ca-certificates
      - uses: actions/checkout@v4
      - run: tests/deb-changelog.sh
      - run: apt-get install -y --no-install-recommends git
      - run: tests/build-deb-same-bytes.sh

  deb-rerun-layout:
    name: a rerun of a DEB release keeps its packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils dpkg-dev python3 python3-yaml ca-certificates
      - uses: actions/checkout@v4
      - run: tests/deb-rerun-layout.sh

  channel-push-race:
    name: channel push survives a lost race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c 'import yaml' || sudo apt-get install -y python3-yaml
      - run: tests/channel-push-race.sh

  pages-live:
    name: the Pages wait reads the deployment status and names a lagging deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: tests/pages-live.sh

  mod-host-fork:
    name: mod-host from the fork, then each fix taken out again
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc make python3 pkgconf-pkg-config libasan diffutils
      - uses: actions/checkout@v4
      - run: tests/mod-host-fork.sh

  surge-xt-package:
    name: the Surge XT package, its pin, its install paths and its load check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: tests/surge-xt-package.sh

  mod-host-rpm:
    name: mod-host RPMs from the fork, and where they sort
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git
      - uses: actions/checkout@v4

      # builds, installs and runs actions/mod-host-protocol/checks/framing-test.sh against the installed package
      - uses: ./.github/actions/mod-host-rpms

      # above the channel's carried-patch builds, which it replaces, and meeting the floor plugin-hostd requires
      - name: The build upgrades the channel's earlier builds
        run: |
          set -euo pipefail
          evr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' mod-host-rpms/mod-host-protocol-[0-9]*.rpm)
          echo "built $evr"
          cmp() { rpm --eval "%{lua: print(rpm.vercmp('$1', '$2'))}"; }
          fail=0
          for old in 0.10.6.f14a230-11.3.omx.fc44 0.10.6.f14a230-11.1 0.10.6.f14a230-12.fc44 0.10.6.f14a230-13.fc44; do
            got=$(cmp "$evr" "$old")
            if [ "$got" = 1 ]; then echo "ok      $evr above $old"; else echo "::error::$evr does not sort above $old"; fail=1; fi
          done
          exit $fail

  mod-host-deb:
    name: mod-host DEBs from the fork, and where they sort
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4

      # builds, lints, installs and runs actions/mod-host-protocol/checks/framing-test.sh against the installed package
      - uses: ./.github/actions/deb-deps
        with:
          names: mod-host-protocol

      - name: The build upgrades the channel's earlier builds, and meets the floor plugin-hostd depends on
        run: |
          set -euo pipefail
          ver=$(dpkg-query -W -f='${Version}' libmod-host-protocol0)
          echo "built $ver"
          [ "$(dpkg-query -W -f='${Version}' libmod-host-protocol-dev)" = "$ver" ]
          [ "$(dpkg-query -W -f='${Version}' mod-host)" = "$ver" ]
          dpkg --compare-versions "$ver" gt 0.1.0-8~omx
          dpkg --compare-versions "$ver" ge 0.1.0-6~fmx

  # The checks repositories run from here: dependency floors from one packaging/deps.txt, no tracked file pointing
  # into a private repository, and a licence header wherever a format can hold one. Each engine proves itself red on
  # every planted drift. The private-refs and spdx-check actions then read this tree, which is their clean control;
  # deps-render reads planted trees only, because this repository declares no floors.
  repo-checks:
    name: deps-render, private-refs-check and spdx-check engines, sabotaged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: .github/actions/deps-render/render.sh --self-test
      - uses: ./.github/actions/private-refs-check
      - uses: ./.github/actions/spdx-check
