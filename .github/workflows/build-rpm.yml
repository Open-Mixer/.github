name: Build RPM (reusable)

# One release path for every OpenMixer package, called by a thin workflow in the package's repository:
#
#   on: { push: { tags: ['v*'] }, workflow_dispatch: {} }
#   jobs:
#     rpm:
#       uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
#       with: { package-name: plugin-hostd }
#       secrets: inherit
#
# A tag builds the RPMs on every architecture of the matrix (each on a runner of its own architecture,
# in a Fedora container), signs them, publishes them into the rpm/ tree of the target Pages repository
# and attaches them to the GitHub release of the tag. Anything that is not a tag is a snapshot build: it
# publishes nothing and only assembles an UNSIGNED tree as an artifact. Unsigned metadata pushed to the
# channel would have clients trust it, and a published NEVRA cannot be taken back.
#
# staged: true (a workflow_dispatch of the caller, never a tag) builds the quick set (fc44 and fc45 on x86_64) or,
# told full, every Fedora release of fedora-versions on every architecture of arch-matrix, against the staging
# channel, and publishes it to the staging channel of the release wave:
# staging/rpm of the same target repository, signed with the same key, by the same tree script and channel-push as a
# release (docs/release-operations.md). The next layer's builds and install checks add that channel at a higher
# priority than the real one (staging: true here, add-openmixer staging: true elsewhere) and resolve to the staged
# packages with no code of their own. A staged run never writes the real channel; the wave's release pass publishes
# the whole set there once, from the v<version> tags, and the purge-staging workflow then empties the staging channel.
# staging: true on a run that is not staged (a dry run on a branch) builds against the staging channel and publishes
# nothing. Neither runs on a tag or with source-ref, and a staged run builds the calling repository's own commit.
#
# WHICH CELLS A RUN BUILDS (docs/release-operations.md, "The quick set and the full matrix"): the matrix input,
# quick or full, when the caller passes it. Without it a release (a tag, source-ref) builds what the organisation
# variable OMX_RELEASE_MATRIX says, and the FULL matrix when it is unset: a caller that changes nothing publishes
# every cell on a tag, as before, unless a release wave is open. A staged run and a workflow_dispatch build what the
# variable says and the QUICK set when it is unset; a pull request always builds the full matrix. The install checks
# run for the built cells, no others.
#
# The packaging lives in the calling repository: exactly one packaging/*.spec, whose Version: is the
# version, and a tag that must be v<Version> on the commit being built. A BuildRequires the channel already
# serves (plugin-hostd-devel) comes from the channel's repository, enabled inside the build container only.
#
# Secrets (organisation secrets, passed by `secrets: inherit`):
#   OPENMIXER_PACKAGES_SIGNING_KEY   the release key's packages subkey, armored, exported subkey-only and
#                                    without a passphrase (platform signing-keys.yml, project openmixer)
#   PAGES_TOKEN          token with contents write on the target repository
#
# The composite actions this workflow uses are ../actions of this repository, referenced at @v1:
# a reusable workflow cannot name its own ref, so it moves with main like the workflow does.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label for the x86 jobs (a private repo passes its own runners, e.g. arc-freemixer; arm builds keep ubuntu-24.04-arm; a tag or release of a PUBLIC repository builds its x86 jobs on ubuntu-latest so a release never queues behind pull-request CI; a pull request from a fork always runs on GitHub-hosted runners)'
      package-name:
        required: true
        type: string
        description: 'RPM package name, the name of the spec (e.g. plugin-hostd)'
      binary-names:
        type: string
        default: ''
        description: 'Binary RPMs the build must produce, space separated names or globs (e.g. omx-plugins-clap omx-plugins-lv2). Empty means package-name.'
      arch-binary-names:
        type: string
        default: '{}'
        description: 'JSON object of architecture to space separated binary names, for a package whose binaries differ by architecture (each built for its own one: {"x86_64": "a", "aarch64": "b"}). The build and install-check jobs of an architecture it names take its names in place of binary-names; an architecture it does not name takes binary-names. binary-names stays the whole list (the preflight reads it).'
      publish:
        type: boolean
        default: false
        description: 'Sign and publish. Takes effect on a tag only; false or a branch is a dry run.'
      staged:
        type: boolean
        default: false
        description: 'Build the matrix of a release against the staging channel and publish it to the staging channel (staging/rpm of target-repo), never to the real one. Excludes publish.'
      # staged-deps is ignored: callers pass staging instead; removed in the wave's release pass once omx-panel, plugin-hostd and omx-clap-core have switched
      staged-deps:
        type: string
        default: ''
        description: 'Ignored, kept for this wave only so existing callers still validate; pass staging instead'
      staging:
        type: boolean
        default: false
        description: 'Add the staging channel at a higher priority than the real one to the build containers (staged: true implies it). A dry run only: never on a tag, with source-ref or with publish.'
      staging-bootstrap:
        type: boolean
        default: false
        description: 'With staged or staging: a staging channel never published (its index and key both 404) is skipped with a notice instead of failing the build. Only for the first layer of a wave, whose build runs before anything was staged.'
      matrix:
        type: string
        default: ''
        description: "'quick' builds the quick set alone (fc44 and fc45 x86_64 rpm, trixie amd64 and arm64 deb: .github/actions/release-matrix/quick.txt), 'full' the whole matrix. Empty: a release (a tag, source-ref) builds what the organisation variable OMX_RELEASE_MATRIX says and the full matrix without it; a staged run and a workflow_dispatch build what it says and the quick set without it; any other run the full matrix."
      stage:
        type: string
        default: 'all'
        description: 'all builds and publishes; build stops before the publish, leaving the packages as artifacts of the run; publish publishes the artifacts a build stage of the same run left, without building. release-c-lib.yml builds both kinds, runs channel-installability over them, and only then publishes either'
      same-pass:
        type: string
        default: ''
        description: 'Packages other repositories release in the same pass, space separated: a breakage of the channel they cause or suffer is reported, not red (channel-installability)'
      target-repo:
        type: string
        default: 'Open-Mixer/open-mixer.github.io'
        description: 'Pages repository whose rpm/ tree receives the packages'
      base-url:
        type: string
        default: 'https://www.openmixer.org'
        description: 'Where the target repository is served: openmixer-release is installed from there for the channel dependencies and the install check'
      arch-matrix:
        type: string
        default: '["x86_64", "aarch64"]'
        description: 'JSON array of architectures, each built natively'
      fedora-versions:
        type: string
        default: '["44", "45"]'
        description: 'JSON array of the Fedora releases to build for, each in a container of its own; the first one runs the publish'
      needs-mod-host:
        type: boolean
        default: true
        description: 'Build and install mod-host-protocol-devel from the Open-Mixer fork first (docs/mod-host.md) (BuildRequires pkgconfig(mod-host-protocol))'
      build-packages:
        type: string
        default: ''
        description: 'Extra distribution packages installed before the build, space separated'
      channel-deps:
        type: boolean
        default: true
        description: 'Take BuildRequires Fedora does not carry (plugin-hostd-devel) from the channel at base-url'
      changelog-spec:
        type: string
        default: ''
        description: 'Ignored, kept so existing callers still validate: no CHANGELOG.md check remains'
      source-repository:
        type: string
        default: ''
        description: 'Repository to build when it is not the caller (a release dispatched from another repository); empty means the caller'
      source-ref:
        type: string
        default: ''
        description: 'Tag of source-repository to build and release, v<version>; empty means the tag the caller was run on'
      source-sha:
        description: 'With source-ref: the commit that tag must resolve to; each checkout is asserted against it. Empty skips the check.'
        required: false
        type: string
        default: ''
      create-github-release:
        type: boolean
        default: true
        description: 'Attach the signed RPMs to the GitHub release of the tag'
      catch-up:
        type: boolean
        default: false
        description: 'With source-ref (or on the tag): build and publish only the cells of the set that the version, already served, lacks in the channel''s cells.tsv; nothing missing builds nothing. Refuses a version the channel does not serve, a cell some of its packages serve and others lack, and republish. The publish drops the arch-independent packages the channel serves and refuses to write any other file it holds (docs/release-operations.md, "Catching a served version up")'
      republish:
        type: boolean
        default: false
        description: 'Let the release go out over a version the channel already serves. Off, the preflight refuses it (a moved old tag re-running its release); on only to finish a partial publish.'
      verify-install:
        type: boolean
        default: true
        description: 'After a publish, install the new version from the channel in a clean container of each release. false skips the check: the release is then not proven installable, and the worker image dispatch goes out on the publish alone.'
      dispatch-repo:
        type: string
        default: ''
        description: 'Repository whose worker image build is told about the new packages by a repository_dispatch, else the OMX_DISPATCH_REPO variable; neither sends nothing'
      dispatch-event:
        type: string
        default: 'openmixer-package-published'
        description: 'event_type of that repository_dispatch; the worker image build listens for it (client_payload: package, tag, format)'
    secrets:
      DISPATCH_TOKEN:
        required: false
      OPENMIXER_PACKAGES_SIGNING_KEY:
        required: false
      PAGES_TOKEN:
        required: false
      SITE_GPG_KEY:
        required: false

defaults:
  run:
    shell: bash

jobs:
  # Fails a release before any build minutes are spent, and says what is missing.
  preflight:
    name: Check the release can publish
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    outputs:
      set: ${{ steps.matrix.outputs.set }}
      cells: ${{ steps.matrix.outputs.cells }}
      first-arch: ${{ steps.matrix.outputs.first-arch }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      # the cells this run builds and checks: the quick set or the full matrix (docs/release-operations.md)
      - id: matrix
        uses: Open-Mixer/.github/.github/actions/release-matrix@openmixer-v1
        with:
          kind: rpm
          matrix: ${{ inputs.matrix }}
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          staged: ${{ inputs.staged }}
          source-ref: ${{ inputs.source-ref }}
          releases: ${{ inputs.fedora-versions }}
          arches: ${{ inputs.arch-matrix }}
          # a catch-up builds only the cells the version of the tag lacks in the channel
          catch-up: ${{ inputs.catch-up }}
          names: ${{ inputs.binary-names || inputs.package-name }}
          channel: ${{ inputs.target-repo }}
          token: ${{ secrets.PAGES_TOKEN }}

      # what is staged is never a release: a tag, source-ref or publish builds the release, against the real channel only;
      # a staged run publishes to the staging channel alone, the commit it runs on, of the calling repository
      - name: A staged run publishes to staging only, and staging never builds a release
        if: inputs.staged || inputs.staging
        env:
          STAGED: ${{ inputs.staged }}
          STAGING: ${{ inputs.staging }}
          PUBLISH: ${{ inputs.publish }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_REF: ${{ inputs.source-ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          no() { echo "::error::$*"; exit 1; }
          [ "$REF_TYPE" != tag ] || no "staged and staging are for a manual run from a branch, never a tag: a tag builds the release, against the real channel alone"
          [ -z "$SOURCE_REF" ] || no "staged and staging take no source-ref: source-ref builds a release of a tag, against the real channel alone"
          [ "$PUBLISH" != true ] || no "staged and staging exclude publish: a staged run publishes to the staging channel only, and a release never builds against it"
          [ "$STAGED" != true ] || [ -z "$SOURCE_REPOSITORY" ] || no "a staged run builds the calling repository only"

      - name: Read the stage
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          case $STAGE in all|build|publish) ;; *) echo "::error::stage is all, build or publish, not '$STAGE'"; exit 1 ;; esac

      # git history is the changelog: nothing here reads a CHANGELOG.md
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.source-repository == '' }}

      - name: Check the checkout is the verified commit
        if: inputs.source-sha != ''
        env:
          WANT: ${{ inputs.source-sha }}
        run: |
          got=$(git -c safe.directory="$PWD" rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::the checkout is $got but the verified tag resolved to $WANT"; exit 1; }

      # a staged run publishes too (to the staging channel): its secrets and target are checked, never a tag
      - uses: Open-Mixer/.github/.github/actions/release-preflight@openmixer-v1
        with:
          publish: ${{ inputs.publish || inputs.staged }}
          require-tag: ${{ !inputs.staged }}
          tag: ${{ inputs.source-ref }}
          target: ${{ inputs.target-repo }}
          packages: ${{ inputs.binary-names || inputs.package-name }}
          republish: ${{ inputs.republish }}
          catch-up: ${{ inputs.catch-up }}
          kind: rpm
          # the already-served check reads the releases this run publishes into, no others
          releases: ${{ steps.matrix.outputs.releases }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (fc${{ matrix.fedora }}, ${{ matrix.arch }})
    needs: preflight
    # a catch-up of a version served in every cell plans nothing: no build, no publish, and the first job said so
    if: inputs.stage != 'publish' && needs.preflight.outputs.count != '0'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || (inputs.runner != 'ubuntu-latest' && inputs.runner) || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.cells) }}
    env:
      RELEASE_TAG: ${{ inputs.source-ref || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      # pipewire's jack first: mod-host's builddep would otherwise pull jack-audio-connection-kit-devel,
      # which conflicts with the one that spec asks for
      - name: Install the build tools
        env:
          EXTRA: ${{ inputs.build-packages }}
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip python3 \
            pipewire-jack-audio-connection-kit-devel $EXTRA

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.source-repository == '' }}

      - name: Check the checkout is the verified commit
        if: inputs.source-sha != ''
        env:
          WANT: ${{ inputs.source-sha }}
        run: |
          got=$(git -c safe.directory="$PWD" rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::the checkout is $got but the verified tag resolved to $WANT"; exit 1; }

      - uses: Open-Mixer/.github/.github/actions/mod-host-rpms@openmixer-v1
        if: inputs.needs-mod-host

      # for the build only: the repository exists in this container and is never a dependency of a release
      # staged or staging: the staging channel beside it, at a higher priority, so the build takes what the wave staged
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        if: inputs.channel-deps || inputs.staged || inputs.staging
        with:
          base-url: ${{ inputs.base-url }}
          staging: ${{ inputs.staged || inputs.staging }}
          staging-bootstrap: ${{ inputs.staging-bootstrap }}

      - name: Show what the channel provides the build
        if: inputs.channel-deps
        run: dnf repoquery --repo openmixer --repo openmixer-noarch --whatprovides 'pkgconfig(plugin-hostd)'

      - uses: Open-Mixer/.github/.github/actions/build-rpm@openmixer-v1
        with:
          tag: ${{ env.RELEASE_TAG }}

      # the full matrix never goes out on top of a version the channel has for the quick set alone: the cells the
      # dependency lacks could not install what this release publishes (docs/release-operations.md)
      - uses: Open-Mixer/.github/.github/actions/quick-deps@openmixer-v1
        if: needs.preflight.outputs.set == 'full' && inputs.publish && inputs.channel-deps && env.RELEASE_TAG != ''
        with:
          kind: rpm
          base-url: ${{ inputs.base-url }}

      - name: Refuse an empty build, and one of another architecture
        env:
          ARCH: ${{ matrix.arch }}
          FIRST_ARCH: ${{ needs.preflight.outputs.first-arch }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ fromJSON(inputs.arch-binary-names)[matrix.arch] || inputs.binary-names }}
        run: |
          find rpms -name '*.rpm' | sort | tee built.txt
          test -s built.txt || { echo "::error::no RPM was produced"; exit 1; }
          ls rpms/"$NAME"-[0-9]*.src.rpm
          # noarch packages are built once, on the first architecture
          # the binaries are named after the source package unless binary-names says otherwise
          for bin in ${BINARIES:-$NAME}; do
            bins=$(find rpms \( -name "$bin-[0-9]*.$ARCH.rpm" -o -name "$bin-[0-9]*.noarch.rpm" \) | wc -l)
            [ "$bins" -gt 0 ] || { echo "::error::no $bin binary RPM for $ARCH"; exit 1; }
          done
          # every package the spec builds (its subpackages too: -devel, a library package), never
          # debuginfo/debugsource and never the mod-host BuildRequires built beside it
          mkdir -p release
          for pkg in $(rpmspec -q --qf '%{name}\n' packaging/*.spec | grep -vE -- '-debug(info|source)$' | sort -u); do
            cp rpms/"$pkg"-[0-9]*.rpm release/ 2>/dev/null || true
          done
          # the source and noarch packages come out of every job of one Fedora release under the same file name
          # with different bytes; merge-multiple would write them over each other, so only the first architecture
          # ships them (each release's dist tag, .fc44 or .fc45, keeps the releases apart)
          if [ "$ARCH" != "$FIRST_ARCH" ]; then
            rm -f release/*.src.rpm release/*.noarch.rpm
          fi
          # a package whose every binary is noarch stages nothing on a later architecture: that job
          # uploads nothing, and the first architecture's job carries the release
          find release -name '*.rpm' | sort | tee release.txt
          # a noarch binary ships from the first architecture only, so a later one may stage fewer
          staged=0
          for bin in ${BINARIES:-$NAME}; do
            grep -q "/$bin-[0-9]" release.txt && staged=$((staged + 1))
          done
          if [ "$ARCH" = "$FIRST_ARCH" ]; then
            [ "$staged" -eq "$(echo ${BINARIES:-$NAME} | wc -w)" ] || { echo "::error::not every binary RPM (${BINARIES:-$NAME}) is among the staged RPMs"; exit 1; }
          else
            # a later architecture may stage nothing only when every binary it built is noarch
            for bin in ${BINARIES:-$NAME}; do
              if find rpms -name "$bin-[0-9]*.$ARCH.rpm" | grep -q . && ! grep -q "/$bin-[0-9]" release.txt; then
                echo "::error::$bin built for $ARCH but was not staged"; exit 1
              fi
            done
          fi

      # mod-host and its protocol library are built to satisfy BuildRequires and are not part of the release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-rpms-fc${{ matrix.fedora }}-${{ matrix.arch }}
          path: release/*.rpm
          if-no-files-found: ${{ matrix.arch == needs.preflight.outputs.first-arch && 'error' || 'ignore' }}
          retention-days: 30

  publish:
    name: Sign and publish
    needs: [preflight, build]
    # the publish stage takes the packages a build stage of this run left; channel-installability inside the
    # publish action refuses a release that would leave a package of the channel uninstallable
    if: ${{ !cancelled() && inputs.stage != 'build' && needs.preflight.result == 'success' && needs.preflight.outputs.count != '0' && (needs.build.result == 'success' || (inputs.stage == 'publish' && needs.build.result == 'skipped')) }}
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: fedora:${{ fromJSON(inputs.fedora-versions)[0] }}
    # The tree of the target repository is shared by every package and race-protected only by git's
    # refusal of a non-fast-forward push; one group per target serialises this organisation's runs.
    # A dry run (publish false) pushes nothing, so it gets a group of its own: sharing the live group made
    # concurrent pull-request dry runs cancel each other's pending job.
    concurrency:
      group: publish-${{ inputs.target-repo }}-${{ (inputs.publish || inputs.staged) && 'live' || github.run_id }}
      cancel-in-progress: false
    env:
      # a release (publish on a tag) to the real channel, or a staged run to the staging channel
      DO_PUBLISH: ${{ (inputs.publish && (inputs.source-ref != '' || github.ref_type == 'tag')) || inputs.staged }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.package-name }}-rpms-fc*
          merge-multiple: true
          path: collected

      - id: publish
        uses: Open-Mixer/.github/.github/actions/publish-rpms@openmixer-v1
        with:
          same-pass: ${{ inputs.same-pass }}
          rpm-dir: collected
          tag: ${{ inputs.staged && format('staged {0}', github.sha) || inputs.source-ref || github.ref_name }}
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          staging: ${{ inputs.staged }}
          # a catch-up adds cells to a version: cells.tsv keeps the set the version was published for
          matrix-set: ${{ !inputs.catch-up && needs.preflight.outputs.set || '' }}
          catch-up: ${{ inputs.catch-up }}
          releases: ${{ join(fromJSON(inputs.fedora-versions), ' ') }}

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH == 'true'
        with:
          name: ${{ inputs.package-name }}-rpms-signed
          path: signed/*.rpm
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: ${{ inputs.package-name }}-unsigned-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30

      - name: Report a dry run honestly
        if: env.DO_PUBLISH != 'true'
        run: |
          echo "::warning::dry run: nothing was signed or published. The unsigned tree is attached to this run."

  release:
    name: GitHub release
    needs: publish
    if: inputs.publish && inputs.create-github-release && github.ref_type == 'tag'
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # the release notes are the commit subjects since the previous tag, not GitHub's list of merged pull requests
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: Open-Mixer/.github/.github/actions/changelog@openmixer-v1
        with:
          mode: notes
          tag: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package-name }}-rpms-signed
          path: signed

      - name: Attach the signed RPMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l signed
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" signed/*.rpm --clobber --repo "$GITHUB_REPOSITORY"
          elif gh release create "$TAG" signed/*.rpm --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"; then
            :
          else
            # lost the race to the DEB job, which builds beside this one
            gh release upload "$TAG" signed/*.rpm --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # Pages deploys the pushed commit on its own time, and five releases in a row make it slow. The wait is a job
  # of its own so a slow deployment never fails the publish or holds back the GitHub release, whose assets come
  # from the built files. It reads the Pages deployment status of the commit and fails, naming the deployment,
  # after 30 minutes.
  live:
    name: Pages deployment
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.commit != '' }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: Open-Mixer/.github/.github/actions/pages-live@openmixer-v1
        with:
          channel: ${{ inputs.target-repo }}
          commit: ${{ needs.publish.outputs.commit }}
          token: ${{ secrets.PAGES_TOKEN }}

  # The last proof: the version the tag names installs from the channel, in a fedora that holds nothing else.
  # Pages serves the push a little late, so the check retries before it calls the release broken. A staged run checks
  # every target the same way, with the staging channel added: the build of this commit installs, from staging.
  verify:
    name: Install check (fc${{ matrix.fedora }}, ${{ matrix.arch }})
    needs: [preflight, publish, release, live]
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.verify-install && ((inputs.publish && (inputs.source-ref != '' || github.ref_type == 'tag')) || inputs.staged) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || (inputs.runner != 'ubuntu-latest' && inputs.runner) || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.cells) }}
    steps:
      # the real channel alone for a release; with the staging channel for a staged run
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          base-url: ${{ inputs.base-url }}
          staging: ${{ inputs.staged }}

      - name: Install the new version from the channel
        if: ${{ !inputs.staged }}
        env:
          TAG: ${{ inputs.source-ref || github.ref_name }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ fromJSON(inputs.arch-binary-names)[matrix.arch] || inputs.binary-names }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          set -o pipefail
          ver=${TAG#v}
          for bin in ${BINARIES:-$NAME}; do
            ok=
            for try in $(seq 1 20); do
              dnf clean expire-cache -q || true
              if dnf install -y --setopt=install_weak_deps=False --setopt=retries=10 "$bin-$ver"; then ok=1; break; fi
              echo "attempt $try: $bin-$ver is not installable yet"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$bin-$ver does not install from $BASE_URL in a clean fedora"; exit 1; }
            rpm -q --qf '%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n' "$bin"
          done

      - name: Install the staged build of this commit from the staging channel
        if: inputs.staged
        env:
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          set -o pipefail
          for bin in ${BINARIES:-$NAME}; do
            ok=
            for try in $(seq 1 20); do
              dnf clean expire-cache -q || true
              if dnf install -y --setopt=install_weak_deps=False --setopt=retries=10 "$bin"; then ok=1; break; fi
              echo "attempt $try: $bin is not installable from the staging channel yet"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$bin does not install from $BASE_URL/staging/rpm in a clean fedora"; exit 1; }
            rel=$(rpm -q --qf '%{RELEASE}' "$bin")
            repo=$(dnf repoquery --installed --qf '%{from_repo}' "$bin")
            echo "$bin $(rpm -q --qf '%{VERSION}' "$bin")-$rel from $repo"
            short=$(printf '%s\n' "$rel" | sed -n 's/.*\.git[0-9]\{1,\}\.\([0-9a-f]\{7,\}\)\..*/\1/p')
            [ -n "$short" ] && [ "${GITHUB_SHA#"$short"}" != "$GITHUB_SHA" ] || { echo "::error::$bin $rel is not the build of $GITHUB_SHA"; exit 1; }
            case $repo in openmixer-staging*) ;; *) echo "::error::$bin came from $repo, not the staging channel"; exit 1 ;; esac
          done

  # A tag that ends without packages must not be silent: the repository gets an issue naming the tag and the
  # failed jobs. A called workflow cannot raise the token of its caller: the `permissions` below only narrow it.
  # The calling release.yml must itself grant `issues: write` in its top-level `permissions:` (or on the job that
  # calls this workflow). Without it the step fails loudly with an error naming the missing permission.
  report-failure:
    name: Report a failed release
    needs: [preflight, build, publish, release, live, verify]
    if: ${{ always() && inputs.publish && (inputs.source-ref != '' || github.ref_type == 'tag') && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - uses: Open-Mixer/.github/.github/actions/release-failure-issue@openmixer-v1
        with:
          tag: ${{ inputs.source-ref || github.ref_name }}
          token: ${{ github.token }}
          workflow: build-rpm

  # Last: tell the worker image build that the channel holds a new version. Nothing listens for the event yet,
  # so this job may not fail the release (continue-on-error) and says so in its notice when it has no token.
  # Token: DISPATCH_TOKEN, an organisation secret that may dispatch events to dispatch-repo. PAGES_TOKEN is
  # used only when DISPATCH_TOKEN is unset, and the notice says so: its scope is not recorded, so a 403 there
  # is expected and not a release failure. With verify-install false the install check is skipped and the
  # dispatch still goes out once the publish succeeded.
  notify-worker-image:
    name: Tell the worker image build
    needs: [publish, verify]
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && inputs.publish && (inputs.source-ref != '' || github.ref_type == 'tag') && (inputs.dispatch-repo != '' || vars.OMX_DISPATCH_REPO != '') }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Send the repository_dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          TARGET: ${{ inputs.dispatch-repo || vars.OMX_DISPATCH_REPO }}
          EVENT: ${{ inputs.dispatch-event }}
          PACKAGE: ${{ inputs.package-name }}
          TAG: ${{ inputs.source-ref || github.ref_name }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            export GH_TOKEN="$DISPATCH_TOKEN"
          elif [ -n "$PAGES_TOKEN" ]; then
            export GH_TOKEN="$PAGES_TOKEN"
            echo "::notice::DISPATCH_TOKEN is not set; trying PAGES_TOKEN, whose scope on $TARGET is not recorded. Set DISPATCH_TOKEN to make this reliable."
          else
            echo "::notice::no DISPATCH_TOKEN (and no PAGES_TOKEN): the worker image build was not told about $PACKAGE $TAG"
            exit 0
          fi
          gh api "repos/$TARGET/dispatches" -f event_type="$EVENT" \
            -f "client_payload[package]=$PACKAGE" -f "client_payload[tag]=$TAG" -f "client_payload[format]=rpm" \
            -f "client_payload[source]=$GITHUB_REPOSITORY"
          echo "sent $EVENT to $TARGET for $PACKAGE $TAG"
