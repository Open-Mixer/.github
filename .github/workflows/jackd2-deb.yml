name: jackd2 DEBs

# Builds Debian's own jackd2 (jackd2, libjack-jackd2-0, libjack-jackd2-dev, jackd2-firewire) with the jack2 metadata fix
# (jackaudio/jack2#988) as one more quilt patch, from the Debian packaging commit of the jackd2-<release> line of
# .github/pins.txt (packaging/jackd2/make-source.sh), for trixie on both architectures; proves in each cell
# that the installed jackd2 releases what dead clients leave (packaging/jackd2/check.sh); and publishes it into deb/
# of the Pages repository. Released by a tag, once per change: a published version is never rebuilt with new bytes.
# packaging/jackd2/README.md says when it goes away.
#
# A push of a tag `jackd2-*` publishes; a run by hand is a dry run: it builds and assembles an unsigned tree as an
# artifact and signs and pushes nothing (docs/release-operations.md, "Publish only by tagging").

on:
  push:
    tags: ['jackd2-*']
  workflow_dispatch:
    inputs:
      matrix:
        description: "'quick' builds the quick set alone, 'full' the whole matrix; empty: what the organisation variable OMX_RELEASE_MATRIX says, and the quick set without it (.github/actions/release-matrix/quick.txt)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-preflight
        with:
          publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          require-tag: 'false'
          target: Open-Mixer/open-mixer.github.io
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  # The cells this run builds, and what it skips: the quick set while OMX_RELEASE_MATRIX is quick, the whole matrix with
  # full (ruling D25, docs/release-operations.md). The build set, so release-matrix; the whole matrix, written once here; quick.txt cuts it while a wave is quick.
  plan:
    name: Plan the cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
      releases: ${{ steps.matrix.outputs.releases }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        uses: ./.github/actions/release-matrix
        with:
          kind: deb
          matrix: ${{ inputs.matrix }}
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          releases: '["trixie"]'
          arches: '["amd64", "arm64"]'

  build:
    name: Build (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: [preflight, plan]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    container:
      image: debian:${{ matrix.suite }}
      # jackd and the metadata store live in /dev/shm, more than Docker's 64 MB default
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4

      - uses: ./.github/actions/deb-deps
        with:
          names: jackd2

      - name: Lay the packages out by Debian release
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p "out/$SUITE"
          cp dep-debs/*jack*.deb "out/$SUITE/"
          ls "out/$SUITE"

      - name: The installed jackd2 releases what dead clients leave
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends db-util procps
          packaging/jackd2/check.sh 200

      - uses: actions/upload-artifact@v4
        with:
          name: jackd2-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: out
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 30 || 2 }}

  # Debian's jackd2 leaks, ours does not, and ours without the patch leaks again (tests/jackd2-metadata.sh)
  proof:
    name: Debian's jackd2 leaks, ours does not, ours without the patch does
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:trixie
      options: --shm-size=1g
    steps:
      - name: Install git for the checkout
        run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - run: tests/jackd2-metadata.sh

  publish:
    name: Sign and publish
    needs: [plan, build, proof]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    concurrency:
      group: publish-Open-Mixer/open-mixer.github.io
      cancel-in-progress: false
    env:
      DO_PUBLISH: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jackd2-debs-*
          merge-multiple: true
          path: collected

      - uses: ./.github/actions/publish-debs
        with:
          deb-dir: collected
          tag: jackd2
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}


  publish-dry-run:
    name: Assemble the unsigned tree, nothing is published
    needs: [plan, build, proof]
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    env:
      DO_PUBLISH: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jackd2-debs-*
          merge-multiple: true
          path: collected

      - uses: ./.github/actions/publish-debs
        with:
          deb-dir: collected
          tag: jackd2
          sign: 'false'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: jackd2-unsigned-apt-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 30 || 2 }}
