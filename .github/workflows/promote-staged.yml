name: Promote a staged version

# A release wave builds each library once, staged (build-rpm.yml and build-deb.yml with staged: true; a staged build
# writes staging/ of the channel repository only, which no client installs from, so it is the stage flow and not a
# release), and the next layer builds against that. This workflow makes the staged build the release, and ONLY A TAG
# PUSH RUNS IT FOR REAL: pushing v<version> on the commit the staged build recorded copies the packages that commit
# left under staging/ to the channel root, for every Fedora and Debian release, regenerates and signs the repository
# metadata with the publish's own actions, and, once the channel serves the same bytes and they install from the
# channel root alone, creates the GitHub release of the tag from the promoted files. It never creates the tag. Nothing
# is rebuilt and no package is signed: what the layers above were built against is what ships. Any run that is not a
# tag push (a dispatch of the caller) is a dry run: it finds, checks and assembles from the version and commit inputs
# and publishes nothing.
#
# It refuses, before anything is written:
#   - a staged tree that lacks the build for any release or architecture of the matrix, or a source package, or that
#     does not cover a release the channel root serves the package for (actions/promote-staged/collect.py);
#   - a package the release key does not already vouch for: an RPM without a good signature by a key the channel
#     serves, a DEB that is not in the signed staging index (actions/promote-staged/vouch.sh);
#   - a commit that is not on the default branch of the calling repository.
# After the publish it fails when the channel root does not hold or serve the bytes staging held (the checksums are in
# the run log), or when an install check fails.
#
# The promoted packages keep the version string of the staged build (<release>.git<commit time>.<sha> and +git<commit time>.<sha>): the bytes
# are the same, so the name is. The staged files stay under staging/ until the wave's purge (purge-staging.yml).
#
# The REAL package a merge to devel staged (<version>-<release>, <version>[-<revision>]: .github#289) names no commit. The
# merge recorded the commit that built it (staging/<kind>/built/<name>/<version>.commit), and it is promoted only from
# that commit or one descending from it that carries the same version; the install checks then require that real
# version (docs/release-operations.md, "A merge to devel publishes the real package to staging").
#
# The caller, in the repository that owns the version:
#
#   on:
#     push:
#       tags: ['v*']
#     workflow_dispatch:       # a dry run only
#       inputs:
#         version: { type: string, default: '' }
#         commit: { type: string, default: '' }
#   permissions:
#     contents: write        # the GitHub release; a called workflow cannot raise the caller's token
#   jobs:
#     promote:
#       uses: Open-Mixer/.github/.github/workflows/promote-staged.yml@openmixer-v1
#       with:
#         package-name: omx-contract
#         binary-names: omx-contract-devel
#         version: ${{ inputs.version }}
#         commit: ${{ inputs.commit }}
#       secrets: inherit
#
# Secrets (organisation secrets, as the publish uses them): OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN, SITE_GPG_KEY,
# and RPM_GPG_KEY with RPM_GPG_PASSPHRASE, no longer read (declared optional so a caller that still passes them does not fail).

on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
        description: 'The source package, as the staged build named it'
      binary-names:
        type: string
        default: ''
        description: 'The packages every release and architecture must hold and the install check installs, space separated; empty means package-name'
      version:
        type: string
        default: ''
        description: 'A dry run only (a run that is not a tag push): the staged version to look for, without the v. A tag push takes it from the tag v<version>'
      commit:
        type: string
        default: ''
        description: 'A dry run only: the commit of the staged build, short or full. A tag push uses the commit the tag is on'
      bump-exempt:
        type: string
        default: ''
        description: 'Globs, space separated, added to the paths that change no package (.github/** alone by default, package-paths.sh), as the build workflows take them: a real build is promoted only from a commit with no other change since the devel commit that built it'
      target-repo:
        type: string
        default: 'Open-Mixer/open-mixer.github.io'
        description: 'The channel repository'
      base-url:
        type: string
        default: 'https://www.openmixer.org'
        description: 'Where the channel is served: the promoted files are read back from there and the install check adds it'
      rpm:
        type: boolean
        default: true
        description: 'Promote the RPMs'
      deb:
        type: boolean
        default: true
        description: 'Promote the DEBs'
      fedora-versions:
        type: string
        default: '["45"]'
        description: 'JSON array of the Fedora releases a release of this package covers'
      rpm-arch-matrix:
        type: string
        default: '["x86_64", "aarch64"]'
        description: 'JSON array of the RPM architectures'
      suite-matrix:
        type: string
        default: '["trixie"]'
        description: 'JSON array of the Debian releases a release of this package covers'
      deb-arch-matrix:
        type: string
        default: '["amd64", "arm64"]'
        description: 'JSON array of the DEB architectures'
      requires:
        type: string
        default: ''
        description: 'Packages the apt tree must already serve before the DEBs are published'
      create-github-release:
        type: boolean
        default: true
        description: 'Create the GitHub release of v<version> with the promoted files'
      runner:
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label for the x86 jobs, GitHub-hosted by default (a caller that needs a private runner passes it, e.g. arc-freemixer; the organisation variable OMX_RUNNER is not read; a pull request from a fork always runs on GitHub-hosted runners)'
    secrets:
      OPENMIXER_PACKAGES_SIGNING_KEY:
        required: false
      RPM_GPG_KEY:
        required: false
      RPM_GPG_PASSPHRASE:
        required: false
      PAGES_TOKEN:
        required: false
      SITE_GPG_KEY:
        required: false

permissions:
  contents: read

jobs:
  # Reads the staging tree without a secret: which commit the staged build is, that every release and architecture
  # holds it, and that the commit may carry the tag. A refusal here leaves everything as it was.
  find:
    name: Find the staged build
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
      short: ${{ steps.commit.outputs.short }}
      commit: ${{ steps.commit.outputs.commit }}
      # 'true' when the promoted build is the real package a merge to devel staged (collect.py: commit real), so the
      # install checks take <version>-<release> with no .git and the deb <version> with no +git (.github#289)
      real: ${{ steps.commit.outputs.real }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # the tag is the release: a tag push promotes the staged build of the commit the tag is on, and the version is
      # the tag's; any other run is a dry run that takes both from the inputs and publishes nothing
      - id: ver
        env:
          TAGGED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [ "$TAGGED" = true ]; then
            case "$REF_NAME" in v[0-9]*) ;; *) echo "::error::the tag $REF_NAME is not v<version>"; exit 1 ;; esac
            [ -z "$IN_VERSION" ] || [ "$IN_VERSION" = "${REF_NAME#v}" ] || { echo "::error::version $IN_VERSION is not the tag $REF_NAME"; exit 1; }
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            [ -n "$IN_VERSION" ] || { echo "::error::a run that is not a tag push is a dry run and needs the version input"; exit 1; }
            echo "version=$IN_VERSION" >> "$GITHUB_OUTPUT"; echo "commit=$IN_COMMIT" >> "$GITHUB_OUTPUT"
          fi

      # THE REAL PACKAGE IS PROMOTED ONLY FROM THE DEVEL COMMIT THAT BUILT IT (.github#289). Its name holds no commit, so
      # the staging publish of the merge to devel recorded it: staging/<kind>/built/<name>/<version>.commit
      # (publish-rpms/record-built.sh). With a record, every kind this run promotes must hold one, all naming the same
      # commit, and the promotion's commit (the tag's, or the dry run's input) is read out for the version check below.
      # Without one, the staged build is a snapshot named by its commit, as before.
      - id: built
        name: Read the commit that built the real package
        env:
          NAME: ${{ inputs.package-name }}
          VERSION: ${{ steps.ver.outputs.version }}
          RUN_COMMIT: ${{ steps.ver.outputs.commit }}
          RPM: ${{ inputs.rpm }}
          DEB: ${{ inputs.deb }}
          CHANNEL: ${{ inputs.target-repo }}
          DIR: ${{ runner.temp }}/channel
        run: |
          set -euo pipefail
          [ -d "$DIR/.git" ] || git clone --quiet --depth 1 "https://github.com/$CHANNEL" "$DIR"
          built='' have='' lack=''
          for kind in rpm deb; do
            on=$RPM; [ "$kind" = rpm ] || on=$DEB
            [ "$on" = true ] || continue
            rec=staging/$kind/built/$NAME/$VERSION.commit
            if [ -f "$DIR/$rec" ]; then
              c=$(cat "$DIR/$rec")
              [[ $c =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$rec holds '$c', not a full commit"; exit 1; }
              [ -z "$built" ] || [ "$built" = "$c" ] || { echo "::error::the real $NAME $VERSION was built by $built for one kind and by $c for the other: one version, one build"; exit 1; }
              built=$c have="$have $kind"
            else
              lack="$lack $kind"
            fi
          done
          [ -n "$built" ] || { echo "no record of a real build of $NAME $VERSION: a snapshot is promoted by its commit"; exit 0; }
          for kind in $lack; do
            echo "::error::staging/$kind holds no record of the commit that built $NAME $VERSION, and staging/${have# } does ($built): the real build of both kinds comes from one merge to devel"
          done
          [ -z "$lack" ] || exit 1
          [ -n "$RUN_COMMIT" ] || { echo "::error::the real $NAME $VERSION was built by $built, and this run names no commit to promote"; exit 1; }
          full=$(git rev-parse --verify --quiet "$RUN_COMMIT^{commit}") || { echo "::error::$GITHUB_REPOSITORY has no commit $RUN_COMMIT"; exit 1; }
          tree=$RUNNER_TEMP/promoted-tree; rm -rf "$tree"; mkdir -p "$tree"
          git archive "$full" -- packaging debian 2>/dev/null | tar -x -C "$tree" || true
          echo "the real $NAME $VERSION was built by $built; the promotion is of $full"
          { echo "commit=$built"; echo "full=$full"; echo "tree=$tree"; } >> "$GITHUB_OUTPUT"

      # the version the promotion's commit carries, read as the build read it
      - id: rpmver
        if: steps.built.outputs.commit != '' && inputs.rpm
        uses: Open-Mixer/.github/.github/actions/tree-version@openmixer-v1
        with:
          kind: rpm
          dir: ${{ steps.built.outputs.tree }}
      - id: debver
        if: steps.built.outputs.commit != '' && inputs.deb
        uses: Open-Mixer/.github/.github/actions/tree-version@openmixer-v1
        with:
          kind: deb
          dir: ${{ steps.built.outputs.tree }}

      # what changed from the build to the promotion's commit that can change a package (the one definition: package-paths)
      - id: paths
        if: steps.built.outputs.commit != ''
        uses: Open-Mixer/.github/.github/actions/package-paths@openmixer-v1
        with:
          base: ${{ steps.built.outputs.commit }}
          head: ${{ steps.built.outputs.full }}
          exempt: ${{ inputs.bump-exempt }}

      # the tie: the promotion's commit carries the version, is the devel commit that built it or descends from it, and
      # changes no package since it
      - id: tie
        name: The promotion's commit is the build's, or descends from it, at the same version
        if: steps.built.outputs.commit != ''
        env:
          NAME: ${{ inputs.package-name }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILT: ${{ steps.built.outputs.commit }}
          FULL: ${{ steps.built.outputs.full }}
          RPMV: ${{ steps.rpmver.outputs.version }}
          DEBV: ${{ steps.debver.outputs.version }}
          COUNT: ${{ steps.paths.outputs.count }}
          PATHS: ${{ steps.paths.outputs.paths }}
        run: |
          set -euo pipefail
          for v in "rpm:$RPMV" "deb:$DEBV"; do
            [ -z "${v#*:}" ] || [ "${v#*:}" = "$VERSION" ] ||
              { echo "::error::$FULL carries ${v#*:} in its ${v%%:*} packaging, and the real build promoted is $NAME $VERSION"; exit 1; }
          done
          [ -n "$RPMV$DEBV" ] || { echo "::error::$FULL carries no version: the real $NAME $VERSION is promoted only from a commit that carries it"; exit 1; }
          git cat-file -e "$BUILT^{commit}" 2>/dev/null || git fetch -q origin "$BUILT" 2>/dev/null ||
            { echo "::error::$GITHUB_REPOSITORY has no commit $BUILT, which built the real $NAME $VERSION"; exit 1; }
          git merge-base --is-ancestor "$BUILT" "$FULL" ||
            { echo "::error::$FULL does not descend from $BUILT, the devel commit that built the real $NAME $VERSION: it is not promoted"; exit 1; }
          [ -n "$COUNT" ] || { echo "::error::what changed since $BUILT was not read: the real $NAME $VERSION is not promoted"; exit 1; }
          if [ "$COUNT" != 0 ]; then
            while IFS= read -r p; do
              [ -z "$p" ] || echo "::error::$p changes the package since $BUILT, the devel commit that built the real $NAME $VERSION: $FULL is not the build being promoted"
            done <<< "$PATHS"
            exit 1
          fi
          echo "$FULL is $BUILT or descends from it, at $VERSION, and changes no package since"
          echo "real=true" >> "$GITHUB_OUTPUT"

      - id: rpm
        if: inputs.rpm
        uses: Open-Mixer/.github/.github/actions/promote-staged@openmixer-v1
        with:
          kind: rpm
          name: ${{ inputs.package-name }}
          version: ${{ steps.ver.outputs.version }}
          binaries: ${{ inputs.binary-names }}
          releases: ${{ join(fromJSON(inputs.fedora-versions), ' ') }}
          arches: ${{ join(fromJSON(inputs.rpm-arch-matrix), ' ') }}
          commit: ${{ steps.built.outputs.commit != '' && 'real' || steps.ver.outputs.commit }}
          channel: ${{ inputs.target-repo }}
          channel-dir: ${{ runner.temp }}/channel
          out: ${{ runner.temp }}/found-rpm
          vouch: 'false'

      - id: deb
        if: inputs.deb
        uses: Open-Mixer/.github/.github/actions/promote-staged@openmixer-v1
        with:
          kind: deb
          name: ${{ inputs.package-name }}
          version: ${{ steps.ver.outputs.version }}
          binaries: ${{ inputs.binary-names }}
          releases: ${{ join(fromJSON(inputs.suite-matrix), ' ') }}
          arches: ${{ join(fromJSON(inputs.deb-arch-matrix), ' ') }}
          commit: ${{ steps.built.outputs.commit != '' && 'real' || steps.ver.outputs.commit }}
          channel: ${{ inputs.target-repo }}
          channel-dir: ${{ runner.temp }}/channel
          out: ${{ runner.temp }}/found-deb
          vouch: 'false'

      - id: commit
        name: The commit is on the default branch
        env:
          RPM_COMMIT: ${{ steps.rpm.outputs.commit }}
          DEB_COMMIT: ${{ steps.deb.outputs.commit }}
          VERSION: ${{ steps.ver.outputs.version }}
          RUN_COMMIT: ${{ steps.ver.outputs.commit }}
          TIED: ${{ steps.tie.outputs.real }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          short=${RPM_COMMIT:-$DEB_COMMIT}
          [ -n "$short" ] || { echo "::error::nothing to promote: both rpm and deb are off"; exit 1; }
          real=false
          # the real package a merge to devel staged names no commit (one build per version, .github#289): it is promoted
          # only on the tie above (the recorded devel commit, the same version, that commit or a descendant); the
          # promotion's own commit is then checked like any other
          if [ "$short" = real ]; then
            [ "${TIED:-}" = true ] || { echo "::error::the staged build is the real package, and no devel commit that built it is tied to this promotion"; exit 1; }
            for c in "$RPM_COMMIT" "$DEB_COMMIT"; do
              case $c in
                ''|real) ;;
                *) echo "::error::the staged RPMs are of '$RPM_COMMIT' and the staged DEBs of '$DEB_COMMIT': one is the real package of a merge to devel, the other a snapshot"; exit 1 ;;
              esac
            done
            [ -n "${RUN_COMMIT:-}" ] || { echo "::error::the staged build is the real package of a merge to devel, and this run names no commit"; exit 1; }
            full=$(git rev-parse --verify --quiet "$RUN_COMMIT^{commit}") || { echo "::error::$GITHUB_REPOSITORY has no commit $RUN_COMMIT"; exit 1; }
            RPM_COMMIT='' DEB_COMMIT='' real=true
          fi
          if [ -n "$RPM_COMMIT" ] && [ -n "$DEB_COMMIT" ] && [ "${RPM_COMMIT#"$DEB_COMMIT"}" = "$RPM_COMMIT" ] && [ "${DEB_COMMIT#"$RPM_COMMIT"}" = "$DEB_COMMIT" ]; then
            echo "::error::the staged RPMs are of $RPM_COMMIT and the staged DEBs of $DEB_COMMIT: name one commit both were built from"; exit 1
          fi
          # a real build keeps short=real (the jobs below collect it by that name) and is promoted at the run's commit
          [ "$real" = true ] || full=$(git rev-parse --verify --quiet "$short^{commit}") || { echo "::error::$GITHUB_REPOSITORY has no commit $short"; exit 1; }
          git merge-base --is-ancestor "$full" "origin/$DEFAULT_BRANCH" ||
            { echo "::error::$full is not on $DEFAULT_BRANCH of $GITHUB_REPOSITORY: a staged build of a commit that never landed is not promoted"; exit 1; }
          if at=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}"); then
            [ "$at" = "$full" ] || { echo "::error::v$VERSION is on $at, and the staged build is of $full"; exit 1; }
          fi
          echo "promoting $VERSION of $full"
          { echo "short=$short"; echo "commit=$full"; echo "real=$real"; } >> "$GITHUB_OUTPUT"

  # The staged RPMs go to rpm/ of the channel through publish-rpms, as a release's do. They are already signed, so the
  # publish places them as they are and signs only the metadata; the tree is compared with the staged checksums before
  # the job ends.
  rpm:
    name: Promote the RPMs
    needs: find
    outputs:
      pushed: ${{ steps.publish.outputs.commit }}
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: fedora:${{ fromJSON(inputs.fedora-versions)[0] }}
    # the group of every publish to this channel; a dry run pushes nothing and gets a group of its own
    concurrency:
      group: publish-${{ inputs.target-repo }}-live
      cancel-in-progress: false
    steps:
      # read inside the publish group: nothing else writes the channel between this read and the push
      - uses: Open-Mixer/.github/.github/actions/promote-staged@openmixer-v1
        if: ${{ inputs.rpm }}
        with:
          kind: rpm
          name: ${{ inputs.package-name }}
          version: ${{ needs.find.outputs.version }}
          binaries: ${{ inputs.binary-names }}
          releases: ${{ join(fromJSON(inputs.fedora-versions), ' ') }}
          arches: ${{ join(fromJSON(inputs.rpm-arch-matrix), ' ') }}
          commit: ${{ needs.find.outputs.short }}
          channel: ${{ inputs.target-repo }}
          out: promote/rpm

      - id: publish
        if: ${{ inputs.rpm }}
        uses: Open-Mixer/.github/.github/actions/publish-rpms@openmixer-v1
        with:
          rpm-dir: promote/rpm
          tag: promote v${{ needs.find.outputs.version }} ${{ needs.find.outputs.short }}
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          staging: false
          # a promotion holds every release and architecture of the matrix (collect.py refuses less)
          matrix-set: full

      - name: The channel root holds the bytes staging held
        if: ${{ inputs.rpm }}
        env:
          DRY_RUN: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = true ]; then tree=build/repo; else tree=build/channel; fi
          sums=$PWD/promote/rpm.sha256
          (cd "$tree" && sha256sum -c "$sums") ||
            { echo "::error::a promoted RPM is not the file staging held"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.rpm }}
        with:
          name: ${{ inputs.package-name }}-promoted-rpms
          path: |
            promote/rpm/*.rpm
            promote/rpm.sha256
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && 30 || 2 }}


  rpm-dry-run:
    name: Assemble the unsigned RPM tree, nothing is published
    needs: find
    if: ${{ inputs.rpm && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: fedora:${{ fromJSON(inputs.fedora-versions)[0] }}
    steps:
      # read inside the publish group: nothing else writes the channel between this read and the push
      - uses: Open-Mixer/.github/.github/actions/promote-staged@openmixer-v1
        with:
          kind: rpm
          name: ${{ inputs.package-name }}
          version: ${{ needs.find.outputs.version }}
          binaries: ${{ inputs.binary-names }}
          releases: ${{ join(fromJSON(inputs.fedora-versions), ' ') }}
          arches: ${{ join(fromJSON(inputs.rpm-arch-matrix), ' ') }}
          commit: ${{ needs.find.outputs.short }}
          channel: ${{ inputs.target-repo }}
          out: promote/rpm

      - id: publish
        uses: Open-Mixer/.github/.github/actions/publish-rpms@openmixer-v1
        with:
          rpm-dir: promote/rpm
          tag: promote v${{ needs.find.outputs.version }} ${{ needs.find.outputs.short }}
          sign: 'false'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          staging: false
          # a promotion holds every release and architecture of the matrix (collect.py refuses less)
          matrix-set: full

      - name: The channel root holds the bytes staging held
        env:
          DRY_RUN: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = true ]; then tree=build/repo; else tree=build/channel; fi
          sums=$PWD/promote/rpm.sha256
          (cd "$tree" && sha256sum -c "$sums") ||
            { echo "::error::a promoted RPM is not the file staging held"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-promoted-rpms
          path: |
            promote/rpm/*.rpm
            promote/rpm.sha256
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && 30 || 2 }}

      - name: Report a dry run honestly
        run: |
          echo "::warning::dry run: the staged RPMs were found, checked and assembled; nothing was signed, pushed or released."

  # The DEBs the same way, through publish-debs: the packages unchanged, the index regenerated and signed.

  deb:
    name: Promote the DEBs
    needs: [find, rpm]
    outputs:
      pushed: ${{ steps.publish.outputs.commit }}
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: debian:trixie
    concurrency:
      group: publish-${{ inputs.target-repo }}-live
      cancel-in-progress: false
    steps:
      - uses: Open-Mixer/.github/.github/actions/promote-staged@openmixer-v1
        if: ${{ inputs.deb }}
        with:
          kind: deb
          name: ${{ inputs.package-name }}
          version: ${{ needs.find.outputs.version }}
          binaries: ${{ inputs.binary-names }}
          releases: ${{ join(fromJSON(inputs.suite-matrix), ' ') }}
          arches: ${{ join(fromJSON(inputs.deb-arch-matrix), ' ') }}
          commit: ${{ needs.find.outputs.short }}
          channel: ${{ inputs.target-repo }}
          out: promote/deb

      - id: publish
        if: ${{ inputs.deb }}
        uses: Open-Mixer/.github/.github/actions/publish-debs@openmixer-v1
        with:
          deb-dir: promote/deb
          tag: promote v${{ needs.find.outputs.version }} ${{ needs.find.outputs.short }}
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          requires: ${{ inputs.requires }}
          changelogs-url: ${{ inputs.base-url }}/deb/changelogs
          staging: false
          # a promotion holds every release and architecture of the matrix (collect.py refuses less)
          matrix-set: full

      - name: The channel root holds the bytes staging held
        if: ${{ inputs.deb }}
        env:
          DRY_RUN: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = true ]; then tree=build/repo; else tree=build/channel; fi
          sums=$PWD/promote/deb.sha256
          (cd "$tree" && sha256sum -c "$sums") ||
            { echo "::error::a promoted DEB is not the file staging held"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.deb }}
        with:
          name: ${{ inputs.package-name }}-promoted-debs
          path: |
            promote/deb/*/*.deb
            promote/deb.sha256
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && 30 || 2 }}


  deb-dry-run:
    name: Assemble the unsigned DEB tree, nothing is published
    needs: find
    if: ${{ inputs.deb && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: debian:trixie
    steps:
      - uses: Open-Mixer/.github/.github/actions/promote-staged@openmixer-v1
        with:
          kind: deb
          name: ${{ inputs.package-name }}
          version: ${{ needs.find.outputs.version }}
          binaries: ${{ inputs.binary-names }}
          releases: ${{ join(fromJSON(inputs.suite-matrix), ' ') }}
          arches: ${{ join(fromJSON(inputs.deb-arch-matrix), ' ') }}
          commit: ${{ needs.find.outputs.short }}
          channel: ${{ inputs.target-repo }}
          out: promote/deb

      - id: publish
        uses: Open-Mixer/.github/.github/actions/publish-debs@openmixer-v1
        with:
          deb-dir: promote/deb
          tag: promote v${{ needs.find.outputs.version }} ${{ needs.find.outputs.short }}
          sign: 'false'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          requires: ${{ inputs.requires }}
          changelogs-url: ${{ inputs.base-url }}/deb/changelogs
          staging: false
          # a promotion holds every release and architecture of the matrix (collect.py refuses less)
          matrix-set: full

      - name: The channel root holds the bytes staging held
        env:
          DRY_RUN: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = true ]; then tree=build/repo; else tree=build/channel; fi
          sums=$PWD/promote/deb.sha256
          (cd "$tree" && sha256sum -c "$sums") ||
            { echo "::error::a promoted DEB is not the file staging held"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-promoted-debs
          path: |
            promote/deb/*/*.deb
            promote/deb.sha256
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && 30 || 2 }}

      - name: Report a dry run honestly
        run: |
          echo "::warning::dry run: the staged DEBs were found, checked and assembled; nothing was signed, pushed or released."

  # The proof a reader of the run log can repeat: every promoted file, fetched from where the channel is served, has
  # the checksum the staged file had.

  served:
    name: The channel serves the same bytes
    needs: [find, rpm, deb]
    if: ${{ !cancelled() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && needs.find.result == 'success' && (needs.rpm.result == 'success' || needs.rpm.result == 'skipped') && (needs.deb.result == 'success' || needs.deb.result == 'skipped') }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 60
    steps:
      # the deb publish is the later push; a channel that already carried the tree pushed nothing and there is no wait
      - uses: Open-Mixer/.github/.github/actions/pages-live@openmixer-v1
        if: needs.deb.outputs.pushed != '' || needs.rpm.outputs.pushed != ''
        with:
          channel: ${{ inputs.target-repo }}
          commit: ${{ needs.deb.outputs.pushed || needs.rpm.outputs.pushed }}
          token: ${{ secrets.PAGES_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.package-name }}-promoted-*
          merge-multiple: true
          path: promoted

      - name: Fetch every promoted file from the channel and compare
        env:
          BASE_URL: ${{ inputs.base-url }}
        run: |
          set -o pipefail
          bad=0
          while read -r want path; do
            got=
            for try in $(seq 1 20); do
              got=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 "$BASE_URL/${path//+/%2B}" | sha256sum | cut -d' ' -f1) || got=
              [ "$got" = "$want" ] && break
              echo "attempt $try: $BASE_URL/$path is not the promoted file yet"; sleep 30
            done
            if [ "$got" = "$want" ]; then echo "same bytes  $want  $path"
            else echo "::error::$BASE_URL/$path has sha256 ${got:-none}, staging held $want"; bad=1; fi
          done < <(cat promoted/*.sha256)
          exit "$bad"

  # The promoted version installs from the channel root alone, in a clean container of every release and architecture,
  # and what installs is the staged build of the commit.
  verify-rpm:
    name: Install check (fc${{ matrix.fedora }}, ${{ matrix.arch }})
    needs: [find, served]
    if: ${{ !cancelled() && inputs.rpm && needs.served.result == 'success' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(inputs.fedora-versions) }}
        arch: ${{ fromJSON(inputs.rpm-arch-matrix) }}
    steps:
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          base-url: ${{ inputs.base-url }}

      - name: Install the promoted version from the channel
        env:
          VERSION: ${{ needs.find.outputs.version }}
          SHORT: ${{ needs.find.outputs.short }}
          REAL: ${{ needs.find.outputs.real }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          set -o pipefail
          for bin in ${BINARIES:-$NAME}; do
            ok=
            for try in $(seq 1 20); do
              dnf clean expire-cache -q || true
              if dnf install -y --setopt=install_weak_deps=False --setopt=retries=10 "$bin-$VERSION"; then ok=1; break; fi
              echo "attempt $try: $bin-$VERSION is not installable yet"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$bin-$VERSION does not install from $BASE_URL in a clean fedora"; exit 1; }
            rel=$(rpm -q --qf '%{RELEASE}' "$bin")
            repo=$(dnf repoquery --installed --qf '%{from_repo}' "$bin")
            echo "$bin $VERSION-$rel from $repo"
            if [ "$REAL" = true ]; then
              # the real package a merge to devel staged: the version itself, a release with no snapshot stamp
              ver=$(rpm -q --qf '%{VERSION}' "$bin")
              if [ "$ver" != "$VERSION" ] || [ "${rel#*.git}" != "$rel" ]; then
                echo "::error::$bin $ver-$rel is not the real $VERSION promoted"; exit 1
              fi
            else
              case $rel in *.git*".$SHORT"* | *".git$SHORT"*) ;; *) echo "::error::$bin $VERSION-$rel is not the staged build of $SHORT"; exit 1 ;; esac
            fi
            case $repo in openmixer-staging*) echo "::error::$bin came from the staging channel, not the channel root"; exit 1 ;; esac
          done

  verify-deb:
    name: Install check (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: [find, served]
    if: ${{ !cancelled() && inputs.deb && needs.served.result == 'success' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite-matrix) }}
        arch: ${{ fromJSON(inputs.deb-arch-matrix) }}
    steps:
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          base-url: ${{ inputs.base-url }}

      - name: Install the promoted version from the channel
        env:
          VERSION: ${{ needs.find.outputs.version }}
          SHORT: ${{ needs.find.outputs.short }}
          REAL: ${{ needs.find.outputs.real }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
          URL: ${{ inputs.base-url }}/deb
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          for bin in ${BINARIES:-$NAME}; do
            ok=
            for try in $(seq 1 20); do
              apt-get update -qq || true
              if [ "$REAL" = true ]; then
                # the real package a merge to devel staged: <version> or <version>-<revision>, never a +git or ~git build
                pinned=$(apt-cache madison "$bin" | awk -v v="$VERSION" '($3 == v || index($3, v "-") == 1) && $3 !~ /[+~]git/ {print $3; exit}')
              else
                # the staged build of the commit, <version>+git<commit time>.<short>, never the newest
                pinned=$(apt-cache madison "$bin" | awk -v v="$VERSION+git" -v s="$SHORT" 'index($3, v) == 1 {r = substr($3, length(v) + 1); sub(/^[0-9]+\./, "", r); if (index(r, s) == 1) {print $3; exit}}')
              fi
              if [ -n "$pinned" ] && apt-get install -y --no-install-recommends "$bin=$pinned"; then
                dpkg-query -W -f='${Package} ${Version}\n' "$bin" | tee /dev/stderr
                ok=1; break
              fi
              echo "attempt $try: $bin ${pinned:-$VERSION} is not installable yet"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$bin $VERSION ($([ "$REAL" = true ] && echo real || echo "+git$SHORT")) does not install from $URL in a clean debian $SUITE"; exit 1; }
          done

  # Last, and only after the channel serves the bytes and they install: the GitHub release of the tag that started
  # this run, with the promoted files. The calling workflow grants contents: write.
  release-go:
    name: Release gate
    needs: [find, served, verify-rpm, verify-deb]
    # the conditions of the release live here, so that the job which creates it can carry the tag condition alone
    if: ${{ !cancelled() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && needs.served.result == 'success' && (needs.verify-rpm.result == 'success' || needs.verify-rpm.result == 'skipped') && (needs.verify-deb.result == 'success' || needs.verify-deb.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "the GitHub release may be created"

  release:
    name: GitHub release
    needs: [find, release-go]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: Open-Mixer/.github/.github/actions/changelog@openmixer-v1
        if: inputs.create-github-release
        with:
          mode: notes
          tag: v${{ needs.find.outputs.version }}
          notes-file: ${{ runner.temp }}/release-notes.md

      - uses: actions/download-artifact@v4
        if: inputs.create-github-release
        with:
          pattern: ${{ inputs.package-name }}-promoted-*
          merge-multiple: true
          path: promoted

      # DEB file names repeat across Debian releases, so the release is part of the asset name, as build-deb.yml has it
      - name: Create the release from the promoted files
        if: inputs.create-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.find.outputs.version }}
        run: |
          set -o pipefail
          mkdir assets
          find promoted -name '*.rpm' -exec cp {} assets/ \;
          while IFS= read -r deb; do
            suite=$(basename "$(dirname "$deb")")
            base=$(basename "$deb" .deb)
            cp "$deb" "assets/${base%_*}_${suite}_${base##*_}.deb"
          done < <(find promoted -name '*.deb' | sort)
          ls -l assets
          test -n "$(ls assets)" || { echo "::error::no promoted file to attach"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          fi
