name: clap-headers DEBs

# Builds clap-headers from the pin of .github/pins.txt for every Debian release and publishes it into deb/ of the
# Pages repository. libomx-clap-core-dev Depends on clap-headers, so the -dev package installs only where this
# package is served: Debian carries no CLAP header package. Run by hand, once per pin: the package carries the
# version of actions/deb-deps/clap-headers/changelog, and a published version is never rebuilt with new bytes, so
# a moved pin needs a new changelog entry with it.
#
# The package is Architecture: all, so one build per Debian release serves every architecture.
#
# publish=false, the default, is a dry run: it builds and assembles an unsigned tree as an artifact. Nothing is
# published by it, and the run says so in its summary; a publish ends by reading the channel back for the package.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on the main branch publishes'
        type: boolean
        default: false
      matrix:
        description: "'quick' builds the quick set alone, 'full' the whole matrix; empty: what the organisation variable OMX_RELEASE_MATRIX says, and the quick set without it (.github/actions/release-matrix/quick.txt)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to publish from anywhere but main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: echo "::error::publish is only for a run on main"; exit 1

      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-preflight
        with:
          publish: ${{ inputs.publish }}
          require-tag: 'false'
          target: Open-Mixer/open-mixer.github.io
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  # The cells this run builds, and what it skips: the quick set while OMX_RELEASE_MATRIX is quick, the whole matrix with
  # full (ruling D25, docs/release-operations.md). The build set, so release-matrix. The package is Architecture: all, so
  # one build per Debian release serves every architecture and amd64 stands for them all.
  plan:
    name: Plan the cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
      releases: ${{ steps.matrix.outputs.releases }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        uses: ./.github/actions/release-matrix
        with:
          kind: deb
          matrix: ${{ inputs.matrix }}
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          releases: '["bookworm", "trixie"]'
          arches: '["amd64"]'

  build:
    name: Build (${{ matrix.suite }})
    needs: [preflight, plan]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.repository.private == false && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4

      - uses: ./.github/actions/deb-deps
        with:
          names: clap-headers

      - name: Lay the packages out by Debian release
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p "out/$SUITE"
          cp dep-debs/clap-headers*.deb "out/$SUITE/"

      - uses: actions/upload-artifact@v4
        with:
          name: clap-headers-debs-${{ matrix.suite }}
          path: out
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    concurrency:
      group: publish-Open-Mixer/open-mixer.github.io
      cancel-in-progress: false
    env:
      DO_PUBLISH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: clap-headers-debs-*
          merge-multiple: true
          path: collected

      - uses: ./.github/actions/publish-debs
        with:
          deb-dir: collected
          tag: clap-headers
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          # the original key co-signs the apt index while installs may hold only it (publish-debs)
          cosign-key: ${{ secrets.RPM_GPG_KEY }}
          cosign-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}

      - name: Say whether anything was published
        if: env.DO_PUBLISH != 'true'
        run: |
          msg="dry run: nothing was signed or pushed to the channel; dispatch again with publish=true on main to publish"
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the channel serves the new package
        if: env.DO_PUBLISH == 'true'
        env:
          SUITES: ${{ needs.plan.outputs.releases }}
        run: |
          # The index of each suite built here must name clap-headers at the version built here, once Pages has caught up.
          # A green publish is not proof: a dry run is green too (2026-10-08).
          ok=0
          for suite in $SUITES; do
            url="https://www.openmixer.org/deb/debian/$suite/Packages"
            for try in $(seq 1 30); do
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -L "$url" | awk -v RS= '/(^|\n)Package: clap-headers(\n|$)/ && /(^|\n)Version: 1\.2\.10-1(\n|$)/ {f=1} END {exit !f}'; then
                echo "$suite serves clap-headers 1.2.10-1"; ok=$((ok + 1)); break
              fi
              sleep 10
            done
          done
          [ "$ok" -eq "$(wc -w <<< "$SUITES")" ] || { echo "::error::the channel does not serve clap-headers 1.2.10-1 on every suite built here ($SUITES)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: clap-headers-unsigned-apt-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30
