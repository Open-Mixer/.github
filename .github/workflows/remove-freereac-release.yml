name: remove-freereac-release

# Takes FreeREAC's freereac-release out of the OpenMixer channel, and nothing else (.github#224). The mirror, removed with
# that issue, published freereac-release 1-2 into this channel (rpm/fedora/45/noarch, deb/debian/trixie/all and its
# changelog) while openmixer-release 1-7 to 1-9 required it; the OpenMixer and FreeREAC channels are independent (owner
# ruling 2026-11-23). The channel's own prune cannot drop it: openmixer-release 1-9, which the channel still serves,
# requires it, and the prune's drop invariant refuses a plan that leaves a kept package uninstallable.
#
# tools/remove-freereac-release.sh does the work, the package a constant of the script: it removes the files that are
# freereac-release by their own header and nothing else, makes the metadata again with the publish's tree scripts and
# signs it, and audits the checkout so that only freereac-release and metadata changed. channel-pull and channel-push are
# the publish's, so the push is one signed commit per tree, in the publish concurrency group, and a lost race runs the
# script again on the new tip (where it removes nothing if a run already did).
#
# A tag remove-freereac-release-<n> on this repository is the removal; run it after openmixer-release 1-10 is published,
# so the channel's newest openmixer-release requires nothing it no longer serves. A workflow_dispatch, or the tag's own
# check jobs, is a dry run: the channel pulled, the removal made unsigned and the change listed, nothing pushed.
#
# Secrets (organisation secrets, as the publish uses them): OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN, SITE_GPG_KEY.

on:
  push:
    tags: ['remove-freereac-release-*']
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CHANNEL: Open-Mixer/open-mixer.github.io

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Dry run (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: rpm
            image: fedora:45
            tools: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils git curl python3-rpm
          - kind: deb
            image: debian:trixie
            tools: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv git curl ca-certificates findutils dpkg-dev
    steps:
      - run: ${{ matrix.tools }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/channel-pull
        with:
          publish-token: ${{ github.token }}
          channel: ${{ env.CHANNEL }}
          strip: none
      - name: Remove freereac-release from a pulled copy, unsigned, and list the change
        run: |
          set -o pipefail
          tools/remove-freereac-release.sh "${{ matrix.kind }}" build/channel
          git -C build/channel status --short -- "${{ matrix.kind }}" | tee /dev/stderr | grep -E '\.(rpm|deb)$|changelogs/' || true

  rpm:
    name: Remove freereac-release from rpm/
    needs: check
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:45
    concurrency:
      group: publish-Open-Mixer/open-mixer.github.io-live
      cancel-in-progress: false
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils git curl python3-rpm
      - uses: actions/checkout@v4
      - uses: ./.github/actions/import-gpg-key
        with:
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          id-variable: OPENMIXER_GPG_KEY_ID
      - uses: ./.github/actions/channel-pull
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          channel: ${{ env.CHANNEL }}
          strip: none
      - name: Check the signing key is one the channel serves
        run: .github/actions/import-gpg-key/channel-keys.sh check build/channel/rpm/RPM-GPG-KEY-openmixer "$OPENMIXER_GPG_KEY_ID"
      - name: Remove freereac-release and sign the metadata again
        run: tools/remove-freereac-release.sh rpm build/channel "$OPENMIXER_GPG_KEY_ID"
      - uses: ./.github/actions/channel-push
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ env.CHANNEL }}
          tag: ${{ github.ref_name }}
          what: rpm
          rebuild: 'tools/remove-freereac-release.sh rpm build/channel "$OPENMIXER_GPG_KEY_ID"'

  deb:
    name: Remove freereac-release from deb/
    needs: [check, rpm]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    concurrency:
      group: publish-Open-Mixer/open-mixer.github.io-live
      cancel-in-progress: false
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv git curl ca-certificates findutils dpkg-dev
      - uses: actions/checkout@v4
      - uses: ./.github/actions/import-gpg-key
        with:
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          id-variable: OPENMIXER_GPG_KEY_ID
      - uses: ./.github/actions/channel-pull
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          channel: ${{ env.CHANNEL }}
          strip: none
      - name: Check the signing key is one the channel serves
        run: .github/actions/import-gpg-key/channel-keys.sh check build/channel/deb/openmixer.asc "$OPENMIXER_GPG_KEY_ID"
      - name: Remove freereac-release and sign the index again
        run: tools/remove-freereac-release.sh deb build/channel "$OPENMIXER_GPG_KEY_ID"
      - uses: ./.github/actions/channel-push
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ env.CHANNEL }}
          tag: ${{ github.ref_name }}
          what: deb
          rebuild: 'tools/remove-freereac-release.sh deb build/channel "$OPENMIXER_GPG_KEY_ID"'
