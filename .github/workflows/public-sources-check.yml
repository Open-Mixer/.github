name: public-sources-check
# The checks every OpenMixer repository runs on what it publishes, from this repository and nowhere else:
#   - its pull request's own commits carry no attribution line (commit-message-check);
#   - (commit-identity: true) every commit of its pull request is authored by the house author, committed by the signing key's uid and verified
#     by GitHub (commit-identity-check);
#   - (pr-fixes-issue: true) every pull request body closes an issue of Open-Mixer or FreeREAC ("Fixes #N", "Fixes Open-Mixer/<repo>#N")
#     (pr-fixes-issue);
#   - (fedora-workflows: true) no workflow names a Fedora release outside allowed-fedora (fedora-workflow-check);
#   - no tracked file points into a private repository (private-refs-check);
#   - it keeps no copy of these checks and its commit-msg hook is the shared stub (no-local-copies);
#   - a public repository keeps no dated document, no dated folder and no folder of evidence or notes
#     (public-layout-check): the record of how work went is kept in the project's records.
# Each check proves itself on planted inputs before it reads the tree.
#
#   jobs:
#     public-sources:
#       uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1
#       with:
#         commit-identity: true      # optional, off by default; author-email / committer-email override the house pair
#         pr-fixes-issue: true       # optional, off by default; the body of every pull request carries a closing reference
#         fedora-workflows: true     # optional, off by default; allowed-fedora (default "45") is the list of releases a workflow may name
#         runner: arc-freemixer      # optional: a private repository's own runners (default ubuntu-latest)
on:
  workflow_call:
    inputs:
      private-refs:
        description: the checks of a public repository, private-refs-check and public-layout-check (a private repository passes false)
        type: boolean
        default: true
      commit-identity:
        description: run commit-identity-check on pull requests (every commit authored and committed by the house emails and verified). Off by default so moving openmixer-v1 turns no caller red; a repository whose open pull requests are clean passes true
        type: boolean
        default: false
      author-email:
        description: the author email commit-identity-check expects; empty takes the action's default
        type: string
        default: ''
      committer-email:
        description: the committer email commit-identity-check expects; empty takes the action's default
        type: string
        default: ''
      pr-fixes-issue:
        description: run pr-fixes-issue on pull requests (the body has a closing keyword followed by #N, Open-Mixer/<repo>#N or FreeREAC/<repo>#N). Off by default: a survey of the open pull requests of both organisations found 223 of 280 with no such reference, so on by default would turn most callers red the day openmixer-v1 moves; a repository passes true once its own open pull requests carry one
        type: boolean
        default: false
      fedora-workflows:
        description: run fedora-workflow-check (no workflow of the repository names a Fedora release outside allowed-fedora). Off by default so moving openmixer-v1 turns no caller red; a repository that drops its own copy of the check passes true
        type: boolean
        default: false
      allowed-fedora:
        description: the Fedora releases fedora-workflow-check lets a workflow name, space or comma separated; the development matrix is 45 only, the full set returns by widening this list
        type: string
        default: '45'
      runner:
        description: runner label for every job (a private repository passes its own runners, e.g. arc-freemixer; a pull request from a fork always runs on GitHub-hosted runners)
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  commit-messages:
    name: commit messages pass the message check
    if: github.event_name == 'pull_request'
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: Open-Mixer/.github/.github/actions/commit-message-check@openmixer-v1
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}

  commit-identity:
    name: every commit has the house author and committer and is verified
    if: github.event_name == 'pull_request' && inputs.commit-identity
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: Open-Mixer/.github/.github/actions/commit-identity-check@openmixer-v1
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
          author-email: ${{ inputs.author-email }}
          committer-email: ${{ inputs.committer-email }}

  pr-fixes-issue:
    name: the pull request body closes an issue
    if: github.event_name == 'pull_request' && inputs.pr-fixes-issue
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    steps:
      # reads the CURRENT body from the API: an edited body starts no run, and a re-run replays the old payload
      - uses: Open-Mixer/.github/.github/actions/pr-fixes-issue@openmixer-v1
        with:
          number: ${{ github.event.pull_request.number }}

  fedora-workflows:
    name: no workflow names a Fedora release outside the allowed list
    if: inputs.fedora-workflows
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/fedora-workflow-check@openmixer-v1
        with:
          allowed-fedora: ${{ inputs.allowed-fedora }}

  private-refs:
    name: no tracked file points into a private repository
    if: inputs.private-refs
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/private-refs-check@openmixer-v1

  public-layout:
    name: no dated document, no dated folder, no evidence or notes folder
    if: inputs.private-refs
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/public-layout-check@openmixer-v1

  no-local-copies:
    name: the shared checks are not copied here
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/no-local-copies@openmixer-v1
