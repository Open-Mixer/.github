name: Purge the staging channel

# The staging channel holds what a release wave has staged (build-rpm.yml and build-deb.yml with staged: true). Once the
# wave's release pass has published the whole set to the real channel, this empties staging/rpm and staging/deb of the
# channel repository, regenerates their empty metadata with the publish's own tree scripts, signs it with the release
# key, and pushes through channel-push. rpm/ and deb/ are never written; each job refuses a checkout that changed
# anything outside staging/<kind> (actions/purge-staging). Run it by hand (workflow_dispatch: this file is on the default
# branch, the only place GitHub dispatches from), or call it as the last job of the pass:
#
#   purge:
#     needs: [release]
#     uses: Open-Mixer/.github/.github/workflows/purge-staging.yml@openmixer-v1
#     with: { reason: wave-2026-11 }
#     secrets: inherit
#
# drop (name@version[,name@version...]: the package name a file carries and its upstream version) takes only those files
# out of staging/rpm (every fedora/<release>/<arch>, noarch and SRPMS directory) and staging/deb (every suite and
# architecture) and keeps everything else: the metadata of the directories and Debian releases they left is made again
# and signed with the release key, the rest keeps its bytes, and cells.tsv is written again. The rpm job, the first,
# refuses an entry that matches no file of either staging tree, by name, before anything is written; each removed path
# is printed. e.g. a wrong staged version:
#
#   gh workflow run purge-staging.yml -R Open-Mixer/.github -f reason=drop-foo-2 -f drop=foo@2,libfoo@2
#
# Secrets (organisation secrets, as the publish uses them): OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN, SITE_GPG_KEY, and
# RPM_GPG_KEY with RPM_GPG_PASSPHRASE are no longer read (declared optional so a caller that still passes them does not fail); the index carries one signature.

on:
  workflow_dispatch:
    inputs:
      target-repo:
        type: string
        default: 'Open-Mixer/open-mixer.github.io'
        description: 'The channel repository whose staging/ is emptied'
      fedora-versions:
        type: string
        default: '["45"]'
        description: 'JSON array of the Fedora releases whose empty staging index must exist'
      suite-matrix:
        type: string
        default: '["trixie"]'
        description: 'JSON array of the Debian releases whose empty staging index must exist'
      reason:
        type: string
        default: 'purge'
        description: 'The wave or pass, for the commit message'
      dry-run:
        type: boolean
        default: false
        description: 'Purge a pulled copy and push nothing'
      drop:
        type: string
        default: ''
        description: 'name@version,... : remove only the files that are those package versions (upstream version) from staging/rpm and staging/deb; empty purges everything'
  workflow_call:
    inputs:
      target-repo:
        type: string
        default: 'Open-Mixer/open-mixer.github.io'
        description: 'The channel repository whose staging/ is emptied'
      fedora-versions:
        type: string
        default: '["45"]'
        description: 'JSON array of the Fedora releases whose empty staging index must exist'
      suite-matrix:
        type: string
        default: '["trixie"]'
        description: 'JSON array of the Debian releases whose empty staging index must exist'
      reason:
        type: string
        default: 'purge'
        description: 'The wave or pass, for the commit message'
      dry-run:
        type: boolean
        default: false
        description: 'Purge a pulled copy and push nothing'
      drop:
        type: string
        default: ''
        description: 'name@version,... : remove only the files that are those package versions (upstream version) from staging/rpm and staging/deb; empty purges everything'
    secrets:
      OPENMIXER_PACKAGES_SIGNING_KEY:
        required: false
      RPM_GPG_KEY:
        required: false
      RPM_GPG_PASSPHRASE:
        required: false
      PAGES_TOKEN:
        required: false
      SITE_GPG_KEY:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rpm:
    name: Purge staging/rpm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:45
    # the publishes of this organisation to the channel run in this group; the purge waits for them
    concurrency:
      group: publish-${{ inputs.target-repo }}-${{ inputs.dry-run && github.run_id || 'live' }}
      cancel-in-progress: false
    steps:
      # Debian is trixie only (owner ruling 2026-11-28): a retired release in suite-matrix is refused by name here,
      # before anything is read or written (release-matrix/debian-releases.sh, the refusal build-deb.yml applies too)
      - uses: Open-Mixer/.github/.github/actions/debian-releases@openmixer-v1
        with:
          releases: ${{ inputs.suite-matrix }}
      - uses: Open-Mixer/.github/.github/actions/purge-staging@openmixer-v1
        with:
          kind: rpm
          sign: ${{ !inputs.dry-run }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          releases: ${{ join(fromJSON(inputs.fedora-versions), ' ') }}
          reason: ${{ inputs.reason }}
          drop: ${{ inputs.drop }}
          # the first job checks the whole drop list against both staging trees, before either is written
          drop-check: 'true'

  deb:
    name: Purge staging/deb
    needs: rpm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    concurrency:
      group: publish-${{ inputs.target-repo }}-${{ inputs.dry-run && github.run_id || 'live' }}
      cancel-in-progress: false
    steps:
      - uses: Open-Mixer/.github/.github/actions/purge-staging@openmixer-v1
        with:
          kind: deb
          sign: ${{ !inputs.dry-run }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          releases: ${{ join(fromJSON(inputs.suite-matrix), ' ') }}
          reason: ${{ inputs.reason }}
          drop: ${{ inputs.drop }}
          # checked by the rpm job, which this one needs: staging/rpm may already have lost its entries
          drop-check: 'false'
