name: mirror-freereac-release

# Serves freereac-release, and nothing else of FreeREAC's, from this channel too, so that openmixer-release's Requires: freereac-release
# resolves from the OpenMixer channel alone on a machine that has only that channel enabled (an existing client upgrading): dnf and apt
# pull freereac-release from here, it installs the FreeREAC repository and its one key, and that repository then serves reac-pw.
#
# A tag mirror-freereac-release-<Version>-<Release> (the package's own evr; a deb carries Version-Release the same way) is the release:
# it downloads that package from FreeREAC's channel (fedora 44 and 45 rpm, trixie deb), VERIFIES it against the one FreeREAC key
# committed in actions/mirror-release/freereac-key.fpr (an rpm by its signature, a deb by the signed Release and index), takes the rpm's
# signature header off, and publishes it through the shared publish actions, which sign it with THIS channel's key: a client of this
# channel holds only that key, so the FreeREAC signature could not be checked by gpgcheck=1 (actions/mirror-release/mirror.sh explains).
# Anything that is not a tag is a dry run: fetch and verify, nothing signed or published; a workflow_dispatch never publishes.
#
# Secrets (organisation secrets): OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN, SITE_GPG_KEY, as release-package.yml.

on:
  push:
    tags: ['mirror-freereac-release-*']
  workflow_dispatch:
    inputs:
      evr:
        description: 'Version-Release of the freereac-release package to fetch and verify (a dry run, nothing is published)'
        required: true

permissions:
  contents: read

env:
  CHANNEL: Open-Mixer/open-mixer.github.io
  FREEREAC_URL: https://freereac.github.io

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Read the release the tag names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evr: ${{ steps.release.outputs.evr }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - id: release
        env:
          INPUT_EVR: ${{ github.event.inputs.evr }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            evr=${GITHUB_REF_NAME#mirror-freereac-release-}; publish=true
          else
            evr=$INPUT_EVR; publish=false
          fi
          [[ $evr =~ ^[0-9]+-[0-9]+$ ]] || { echo "::error::'$evr' is not a Version-Release like 1-2"; exit 1; }
          echo "evr=$evr" >> "$GITHUB_OUTPUT"; echo "publish=$publish" >> "$GITHUB_OUTPUT"

  checks:
    name: The mirror refuses a source that is not the pinned key's (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: rpm, image: 'fedora:45', tools: 'dnf install -y --setopt=install_weak_deps=False rpm-build rpm-sign gnupg2 findutils curl diffutils' }
          - { kind: deb, image: 'debian:trixie', tools: 'apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv dpkg-dev curl ca-certificates' }
    steps:
      - run: ${{ matrix.tools }}
      - uses: actions/checkout@v4
      - run: tests/mirror-release.sh ${{ matrix.kind }}

  # The cells to mirror come from release-matrix, the one source the release workflows read (quick set while OMX_RELEASE_MATRIX is quick, the
  # whole matrix with full): a Fedora release or a Debian suite added there is mirrored with no edit here, and mirror.sh refuses to run
  # without them. The package is noarch / all: one architecture stands for each release.
  rpm-plan:
    name: Plan the Fedora releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases: ${{ steps.matrix.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        uses: ./.github/actions/release-matrix
        with:
          kind: rpm
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          releases: '["45"]'
          arches: '["x86_64"]'

  deb-plan:
    name: Plan the Debian releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases: ${{ steps.matrix.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        uses: ./.github/actions/release-matrix
        with:
          kind: deb
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          releases: '["trixie"]'
          arches: '["amd64"]'

  rpm:
    name: Fetch and verify the RPMs
    needs: [preflight, checks, rpm-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:45
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False rpm-sign gnupg2 findutils curl
      - uses: actions/checkout@v4
      - env:
          RELEASES: ${{ needs.rpm-plan.outputs.releases }}
        run: .github/actions/mirror-release/mirror.sh rpm "$FREEREAC_URL" freereac-release "${{ needs.preflight.outputs.evr }}" rpms
      - uses: actions/upload-artifact@v4
        with:
          name: mirror-freereac-release-rpm
          path: rpms/*.rpm
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 2 }}

  deb:
    name: Fetch and verify the DEB
    needs: [preflight, checks, deb-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends gnupg gpgv curl ca-certificates
      - uses: actions/checkout@v4
      - env:
          SUITES: ${{ needs.deb-plan.outputs.releases }}
        run: .github/actions/mirror-release/mirror.sh deb "$FREEREAC_URL" freereac-release "${{ needs.preflight.outputs.evr }}" debs
      - uses: actions/upload-artifact@v4
        with:
          name: mirror-freereac-release-deb
          path: debs
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 2 }}

  publish-rpm:
    name: Sign with this channel's key and publish the RPMs
    needs: [preflight, rpm, deb]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:45
    concurrency:
      group: publish-Open-Mixer/open-mixer.github.io-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mirror-freereac-release-rpm
          path: collected
      - uses: ./.github/actions/publish-rpms
        with:
          rpm-dir: collected
          tag: mirror-freereac-release-${{ needs.preflight.outputs.evr }}
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ env.CHANNEL }}

  publish-deb:
    name: Publish the DEB (this channel's index vouches for it)
    needs: [preflight, rpm, deb]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    concurrency:
      group: publish-Open-Mixer/open-mixer.github.io-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mirror-freereac-release-deb
          path: collected
      - uses: ./.github/actions/publish-debs
        with:
          deb-dir: collected
          tag: mirror-freereac-release-${{ needs.preflight.outputs.evr }}
          sign: 'true'
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ env.CHANNEL }}
