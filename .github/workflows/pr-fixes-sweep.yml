name: pr-fixes-sweep
# A daily READ-ONLY sweep of Open-Mixer and FreeREAC (every repository the token reads, archived ones skipped): the open issues
# with no linked pull request for 7 days, and the branches with no open pull request and no issue reference. The method is in
# .github/actions/pr-fixes-sweep/sweep.py. Output is this run's job summary only: no comment, label, close or deletion is
# ever made, and the token is granted read permissions alone. It reads with the repository secret SWEEP_READ_TOKEN (a read-only
# token over both organisations; with no secret the run fails (a house workflow never falls back from one secret to another).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sweep:
    name: issues and branches not tied to a pull request or an issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read both organisations and write the job summary
        env:
          GH_TOKEN: ${{ secrets.SWEEP_READ_TOKEN }}
        run: python3 -I .github/actions/pr-fixes-sweep/sweep.py run --owner Open-Mixer --owner FreeREAC
