name: install-staged
description: Install the staged packages of other repositories (their staged-v<version> prerelease) in one transaction

# A layer of the release chain need not wait for the channel to serve the layer inside it: a staged run of that layer
# (build-rpm.yml / build-deb.yml with staged: true) leaves its fc44 x86_64 RPMs and trixie amd64 DEBs on the prerelease
# staged-v<version> of its repository, and this installs them, before the build dependencies are installed:
#
#       - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
#       - uses: actions/checkout@v4
#       - uses: Open-Mixer/.github/.github/actions/install-staged@openmixer-v1
#         with:
#           packages: plugin-hostd@0.20.3:plugin-hostd-contract,plugin-hostd-devel
#
# Every file of every named repository goes in ONE dnf or apt transaction; what they depend on comes from the
# channels the container has. A missing staged release or package, a file of another version, and a version outside
# the floor and ceiling the checkout's packaging puts on it are refused before anything is installed
# (install-staged.sh). The channel's releases stay the only published ones: the real v<version> tag publishes once,
# at the end of the wave.

inputs:
  packages:
    description: '[owner/]repo@version[:package,package], space or newline separated; owner defaults to Open-Mixer, and without a package list every staged binary of the target is installed'
    required: true
  tree:
    description: the consumer checkout whose packaging/*.spec or debian/control floors and ceilings each staged version must meet
    default: .
  token:
    description: only raises the REST rate limit; the repositories are public and the files download without it
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        STAGED_TREE: ${{ inputs.tree }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        "$GITHUB_ACTION_PATH/install-staged.sh" $PACKAGES
