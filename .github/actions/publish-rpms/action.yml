name: publish-rpms
description: Sign RPMs and publish them into the rpm/ tree of a FreeMixer Pages repository

# The RPM half of a release, run in a Fedora container by the reusable build-rpm workflow on a release tag
# only: publishing a package is a release, never a side effect of a branch push. sign=false assembles an
# unsigned tree in build/repo and pushes nothing.
#
# KEY HONESTY: before signing, the imported key's fingerprint must be one of the keys the channel already
# serves dnf (rpm/RPM-GPG-KEY-openmixer in the pulled tree, else public-key-url); otherwise the run refuses
# rather than sign with a key that gpgcheck=1 clients cannot verify. The first publish into an empty channel
# has nothing to compare with, says so, and sets the key. The served file only grows (channel-keys.sh): a
# new signing key is published next to the old one, by hand, BEFORE the first run that signs with it.
#
# Machines add the repository by installing openmixer-release (packaging/openmixer-release, workflow
# release-package); the tree's rpm/openmixer.repo is the file that package installs, written by publish-tree.sh.

inputs:
  rpm-dir:
    description: directory holding the RPMs to publish
    required: true
  tag:
    description: the release tag, for the commit message
    required: true
  sign:
    description: 'true signs and pushes; anything else assembles an unsigned tree in build/repo and pushes nothing'
    default: 'false'
  gpg-key:
    default: ''
  gpg-passphrase:
    default: ''
  publish-token:
    default: ''
  site-gpg-key:
    description: the SITE_GPG_KEY secret, armored; signs the channel commit
    default: ''
  channel:
    description: the channel repository
    default: Open-Mixer/open-mixer.github.io
  branch:
    default: main
  public-key-url:
    description: where dnf fetches the public key from, when the channel tree does not hold it yet; empty skips that comparison
    default: ''
  installability:
    description: 'true (the default) refuses a release that leaves a package of the channel uninstallable (channel-installability), before anything is signed; false only for a package nothing depends on'
    default: 'true'
  same-pass:
    description: packages other repositories release in the same pass, space separated (channel-installability)
    default: ''
  served-url:
    description: where the channel's rpm/ tree is served, read by the installability check of a dry run, which pulls no tree
    default: https://www.openmixer.org/rpm
  signed-dir:
    description: directory receiving the signed copies of the published packages
    default: signed

outputs:
  commit:
    description: the commit pushed to the channel; empty when nothing was pushed (a dry run, or the channel already carried the tree)
    value: ${{ steps.push.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Install the packaging tools
      shell: bash
      run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils git curl python3-rpm

    - name: Prove the packages are there before anything signs them
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
      run: |
        set -o pipefail
        find "$RPM_DIR" -name '*.rpm' | sort | tee /tmp/collected.txt
        test -s /tmp/collected.txt || { echo "::error::no RPM under $RPM_DIR"; exit 1; }

    - uses: Open-Mixer/.github/.github/actions/import-gpg-key@main
      if: inputs.sign == 'true'
      with:
        gpg-key: ${{ inputs.gpg-key }}
        gpg-passphrase: ${{ inputs.gpg-passphrase }}
        id-variable: OPENMIXER_GPG_KEY_ID

    - uses: Open-Mixer/.github/.github/actions/channel-pull@main
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}

    - name: Check the signing key is one the channel serves
      if: inputs.sign == 'true'
      shell: bash
      env:
        PUBLIC_KEY_URL: ${{ inputs.public-key-url }}
      run: |
        set -o pipefail
        keys=build/channel/rpm/RPM-GPG-KEY-openmixer
        if [ ! -s "$keys" ] && [ -n "$PUBLIC_KEY_URL" ]; then
          keys=$(mktemp)
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 "$PUBLIC_KEY_URL" > "$keys"
        fi
        "$GITHUB_ACTION_PATH/../import-gpg-key/channel-keys.sh" check "$keys" "$OPENMIXER_GPG_KEY_ID"

    # Before the tree is assembled and signed: the channel with this release in it still installs everything that
    # installed before, and no published consumer is left outside its ceiling (channel-installability). A publish
    # reads the tree it pulled, a dry run the served channel.
    - name: Check no package of the channel becomes uninstallable
      if: inputs.installability != 'false'
      shell: bash
      env:
        PKG_DIR: ${{ inputs.rpm-dir }}
        SIGN: ${{ inputs.sign }}
        SAME_PASS: ${{ inputs.same-pass }}
        SERVED: ${{ inputs.served-url }}
      run: |
        set -o pipefail
        # a dry run builds one architecture: on the others, what it built counts as released in the same pass (the
        # release builds every architecture), and every architecture is still checked
        if [ "$SIGN" = true ]; then channel=$PWD/build/channel/rpm; else channel=$SERVED; export UNBUILT_ARCH_PASS=true; fi
        "$GITHUB_ACTION_PATH/../channel-installability/run.sh" rpm "$PKG_DIR" "$channel"

    - name: Assemble the tree
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/channel/rpm "$RPM_DIR" "$OPENMIXER_GPG_KEY_ID"
        else
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/repo/rpm "$RPM_DIR"
        fi

    - name: Prove the tree holds packages and metadata
      shell: bash
      env:
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then tree=build/channel/rpm; else tree=build/repo/rpm; fi
        find "$tree" -name '*.rpm' | sort
        test -n "$(find "$tree" -name '*.rpm' -print -quit)" || { echo "::error::the tree holds no package"; exit 1; }
        test -n "$(find "$tree" -name repomd.xml -print -quit)" || { echo "::error::no repodata in the tree"; exit 1; }
        if [ "$SIGN" = true ]; then
          test -n "$(find "$tree" -name repomd.xml.asc -print -quit)" || { echo "::error::repodata is not signed"; exit 1; }
        fi

    # The rebuild command runs inside the job's container, where the action lives under a different path than
    # the one the runner expands in a template on the host: it must name the script by this run-time variable.
    - name: Name the action path for the rebuild
      if: inputs.sign == 'true'
      shell: bash
      run: echo "PUBLISH_RPMS_ACTION=$GITHUB_ACTION_PATH" >> "$GITHUB_ENV"

    - id: push
      uses: Open-Mixer/.github/.github/actions/channel-push@main
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        site-gpg-key: ${{ inputs.site-gpg-key }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}
        tag: ${{ inputs.tag }}
        what: rpm
        rebuild: '"$PUBLISH_RPMS_ACTION/publish-tree.sh" build/channel/rpm "${{ inputs.rpm-dir }}" "$OPENMIXER_GPG_KEY_ID"'

    # After the push: a push that lost a race rebuilds and re-signs the tree, and the copies must be the bytes
    # the channel serves, not those of the first attempt.
    - name: Keep the signed copies
      if: inputs.sign == 'true'
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
        SIGNED_DIR: ${{ inputs.signed-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$SIGNED_DIR"
        while IFS= read -r f; do
          found=$(find build/channel/rpm -name "$(basename "$f")" -print -quit)
          test -n "$found" || { echo "::error::$(basename "$f") is not in the tree"; exit 1; }
          cp "$found" "$SIGNED_DIR/"
        done < <(find "$RPM_DIR" -name '*.rpm' | sort)
        ls "$SIGNED_DIR"
