name: publish-debs
description: Sign DEBs and publish them into the deb/ tree of a FreeMixer Pages repository

# The DEB half of a release, run in a Debian container by the reusable build-deb workflow on a release tag
# only. The tree is one flat apt repository per Debian release, deb/debian/<suite>/, holding <arch>/*.deb,
# Packages, Release, InRelease and Release.gpg; users point apt at it with `deb [signed-by=...] <url> ./`.
# The key is the one that signs the RPMs. cosign-key, when set, also signs Release.gpg and InRelease: a key
# change for apt users, whose signed-by file holds the key they saved at install time (publish-tree.sh).
# sign=false assembles an unsigned tree in build/repo and pushes nothing. The shared-tree race is described
# in channel-pull.
#
# staging: true publishes into staging/deb of the same channel instead (the staging channel of a release wave,
# docs/release-operations.md): the same tree script, keys and channel-push, the index labelled OpenMixer-Staging (the
# label the staging pin names), every Debian release of `suites` indexed even with nothing staged for it, and a
# `requires` package may be one the real deb/ tree serves. deb/ is never written.

inputs:
  deb-dir:
    description: directory holding <suite>/*.deb
    required: true
  tag:
    description: the release tag, for the commit message
    required: true
  sign:
    description: 'true signs and pushes; anything else assembles an unsigned tree in build/repo and pushes nothing'
    default: 'false'
  gpg-key:
    default: ''
  gpg-passphrase:
    default: ''
  cosign-key:
    description: a second key that also signs the apt index, armored; empty for none
    default: ''
  cosign-passphrase:
    default: ''
  publish-token:
    default: ''
  site-gpg-key:
    description: the SITE_GPG_KEY secret, armored; signs the channel commit
    default: ''
  channel:
    default: Open-Mixer/open-mixer.github.io
  branch:
    default: main
  requires:
    description: packages the tree must already serve, for every suite and architecture published here, space separated
    default: ''
  changelogs-url:
    description: where the channel's deb/changelogs/ directory is served, for the Changelogs field of the Release files; empty leaves the field out
    default: https://www.openmixer.org/deb/changelogs
  installability:
    description: 'true (the default) refuses a release that leaves a package of the channel uninstallable (channel-installability), before anything is signed; false only for a package nothing depends on'
    default: 'true'
  same-pass:
    description: packages other repositories release in the same pass, space separated (channel-installability)
    default: ''
  served-url:
    description: where the channel's deb/ tree is served, read by the installability check of a dry run, which pulls no tree
    default: https://www.openmixer.org/deb
  signed-dir:
    description: directory receiving the published copies, laid out <suite>/*.deb
    default: signed
  staging:
    description: "'true' publishes into the staging channel, staging/deb of the channel, and never touches deb/"
    default: 'false'
  suites:
    description: with staging, the Debian releases (space separated) whose staging index exists even when empty
    default: ''
  catch-up:
    description: "'true' for a catch-up run: arch-independent packages the channel serves are dropped from the publish, any other file it serves refuses the run before anything is signed, and only what received a package is indexed again (publish-tree.sh CATCH_UP)"
    default: 'false'
  matrix-set:
    description: "'quick' or 'full': the set of the release matrix this run built, recorded for its packages in cells.tsv of the tree; empty records none"
    default: ''

outputs:
  commit:
    description: the commit pushed to the channel; empty when nothing was pushed (a dry run, or the channel already carried the tree)
    value: ${{ steps.push.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Install the packaging tools
      shell: bash
      run: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv git curl ca-certificates findutils dpkg-dev

    - name: Prove the packages are there before anything signs them
      shell: bash
      env:
        DEB_DIR: ${{ inputs.deb-dir }}
        STAGING: ${{ inputs.staging }}
        MATRIX_SET: ${{ inputs.matrix-set }}
        CATCH_UP: ${{ inputs.catch-up }}
        SUITES: ${{ inputs.suites }}
      run: |
        set -o pipefail
        # the set this run built, for cells.tsv: in the job's environment, so a lost-race rebuild records it too
        echo "MATRIX_SET=$MATRIX_SET" >> "$GITHUB_ENV"
        # a catch-up, for the tree script and the lost-race rebuild alike
        echo "CATCH_UP=$CATCH_UP" >> "$GITHUB_ENV"
        # where the packages go in the channel: deb/, or staging/deb/ with its label and skeleton, requires met from deb/
        if [ "$STAGING" = true ]; then
          { echo "DEB_TREE=staging/deb"; echo "LABEL=OpenMixer-Staging"; echo "SKELETON=$SUITES"
            echo "REQUIRES_TREE=build/channel/deb"; echo "NEWEST_ONLY=true"; } >> "$GITHUB_ENV"
        else
          echo "DEB_TREE=deb" >> "$GITHUB_ENV"
        fi
        find "$DEB_DIR" -name '*.deb' | sort | tee /tmp/collected.txt
        test -s /tmp/collected.txt || { echo "::error::no DEB under $DEB_DIR"; exit 1; }

    - uses: Open-Mixer/.github/.github/actions/import-gpg-key@openmixer-v1
      if: inputs.sign == 'true'
      with:
        gpg-key: ${{ inputs.gpg-key }}
        gpg-passphrase: ${{ inputs.gpg-passphrase }}
        id-variable: OPENMIXER_GPG_KEY_ID

    - uses: Open-Mixer/.github/.github/actions/import-gpg-key@openmixer-v1
      if: inputs.sign == 'true' && inputs.cosign-key != ''
      with:
        gpg-key: ${{ inputs.cosign-key }}
        gpg-passphrase: ${{ inputs.cosign-passphrase }}
        id-variable: OPENMIXER_GPG_COSIGN_KEY_ID

    - uses: Open-Mixer/.github/.github/actions/channel-pull@openmixer-v1
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}

    - name: Check the signing keys are ones the channel serves
      if: inputs.sign == 'true'
      shell: bash
      run: |
        set -o pipefail
        # shellcheck disable=SC2086 # the co-signer is one fingerprint or empty
        "$GITHUB_ACTION_PATH/../import-gpg-key/channel-keys.sh" check build/channel/deb/openmixer.asc \
          "$OPENMIXER_GPG_KEY_ID" ${OPENMIXER_GPG_COSIGN_KEY_ID:-}

    # Before the tree is assembled and signed: the channel with this release in it still installs everything that
    # installed before, and no published consumer is left outside its ceiling (channel-installability). A publish
    # reads the tree it pulled, a dry run the served channel.
    - name: Check no package of the channel becomes uninstallable
      # a staged run publishes to the staging channel, which no client installs from by default: the check judges the
      # channel a release lands in, so it runs for a release and a dry run, not for a staged publish
      if: inputs.installability != 'false' && inputs.staging != 'true'
      shell: bash
      env:
        PKG_DIR: ${{ inputs.deb-dir }}
        SIGN: ${{ inputs.sign }}
        SAME_PASS: ${{ inputs.same-pass }}
        SERVED: ${{ inputs.served-url }}
      run: |
        set -o pipefail
        # a dry run builds one architecture: on the others, what it built counts as released in the same pass (the
        # release builds every architecture), and every architecture is still checked. A release of the quick set is
        # the same on the cells it does not build: the wave's full release builds them (tests/quick-unbuilt-pass.sh)
        if [ "$SIGN" = true ]; then channel=$PWD/build/channel/$DEB_TREE; else channel=$SERVED; export UNBUILT_ARCH_PASS=true; fi
        if [ "${MATRIX_SET:-}" = quick ]; then export UNBUILT_ARCH_PASS=true; fi
        "$GITHUB_ACTION_PATH/../channel-installability/run.sh" deb "$PKG_DIR" "$channel"

    - name: Assemble the tree
      shell: bash
      env:
        DEB_DIR: ${{ inputs.deb-dir }}
        SIGN: ${{ inputs.sign }}
        # only a publish is held to what the channel serves; a dry run has no channel tree to ask
        REQUIRES: ${{ inputs.sign == 'true' && inputs.requires || '' }}
        CHANGELOGS_URL: ${{ inputs.changelogs-url }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then
          COSIGN=${OPENMIXER_GPG_COSIGN_KEY_ID:-} "$GITHUB_ACTION_PATH/publish-tree.sh" "build/channel/$DEB_TREE" "$DEB_DIR" "$OPENMIXER_GPG_KEY_ID"
        else
          "$GITHUB_ACTION_PATH/publish-tree.sh" "build/repo/$DEB_TREE" "$DEB_DIR"
        fi

    - name: Prove the tree holds packages and an index
      shell: bash
      env:
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then tree=build/channel/$DEB_TREE; else tree=build/repo/$DEB_TREE; fi
        find "$tree" -name '*.deb' | sort
        test -n "$(find "$tree" -name '*.deb' -print -quit)" || { echo "::error::the tree holds no package"; exit 1; }
        test -n "$(find "$tree" -name Packages -print -quit)" || { echo "::error::no index in the tree"; exit 1; }
        if [ "$SIGN" = true ]; then
          test -n "$(find "$tree" -name InRelease -print -quit)" || { echo "::error::the index is not signed"; exit 1; }
          test -s "$tree/openmixer.asc" || { echo "::error::no public key in the tree"; exit 1; }
        fi

    # The rebuild command runs inside the job's container, where the action lives under a different path than
    # the one the runner expands in a template on the host: it must name the script by this run-time variable.
    - name: Name the action path for the rebuild
      if: inputs.sign == 'true'
      shell: bash
      run: echo "PUBLISH_DEBS_ACTION=$GITHUB_ACTION_PATH" >> "$GITHUB_ENV"

    - id: push
      uses: Open-Mixer/.github/.github/actions/channel-push@openmixer-v1
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        site-gpg-key: ${{ inputs.site-gpg-key }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}
        tag: ${{ inputs.tag }}
        what: ${{ inputs.staging == 'true' && 'staging/deb' || 'deb' }}
        # LABEL, SKELETON and REQUIRES_TREE are in the job's environment (the first step), unset for the real tree
        rebuild: 'REQUIRES="${{ inputs.requires }}" CHANGELOGS_URL="${{ inputs.changelogs-url }}" COSIGN="${OPENMIXER_GPG_COSIGN_KEY_ID:-}" "$PUBLISH_DEBS_ACTION/publish-tree.sh" "build/channel/$DEB_TREE" "${{ inputs.deb-dir }}" "$OPENMIXER_GPG_KEY_ID"'

    # After the push: a push that lost a race rebuilds and re-signs the tree, and the copies must be the bytes
    # the channel serves, not those of the first attempt.
    - name: Keep the published copies
      if: inputs.sign == 'true'
      shell: bash
      env:
        DEB_DIR: ${{ inputs.deb-dir }}
        SIGNED_DIR: ${{ inputs.signed-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$SIGNED_DIR"
        while IFS= read -r f; do
          found=$(find "build/channel/$DEB_TREE" -name "$(basename "$f")" -print -quit)
          test -n "$found" || { echo "::error::$(basename "$f") is not in the tree"; exit 1; }
          cp "$found" "$SIGNED_DIR/"
        done < <(find "$DEB_DIR" -name '*.deb' | sort)
        ls "$SIGNED_DIR"
