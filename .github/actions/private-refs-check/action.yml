name: private-refs-check
description: Fail when a tracked file of a public repository points into a private repository

# One engine for every OpenMixer repository, and no file is exempt. The caller has checked the repository out.
# The action first proves the engine goes red on each kind of pointer, then reads the tree. Every repository is checked
# but one that is private and carries the topic stays-private: the engine reads both, with the run's token, in one
# lookup, and skips that one with a line naming it; an answer it cannot read is red.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        "$GITHUB_ACTION_PATH/check.sh" --self-test
        "$GITHUB_ACTION_PATH/check.sh" "$GITHUB_WORKSPACE"
