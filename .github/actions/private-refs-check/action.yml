name: private-refs-check
description: Fail when a tracked file of a public repository points into a private repository

# One engine for every OpenMixer repository, and no file is exempt. The caller has checked the repository out.
# The action first proves the engine goes red on each kind of pointer, then reads the tree. The rule is a public
# repository's: the engine reads this run's repository's visibility from the Actions context (the token reads it from
# GitHub when the event carries none) and skips a private one with a line naming it; a visibility it cannot read is red.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PRIVATE_REFS_VISIBILITY: ${{ github.event.repository.visibility }}
        GH_TOKEN: ${{ github.token }}
      run: |
        "$GITHUB_ACTION_PATH/check.sh" --self-test
        "$GITHUB_ACTION_PATH/check.sh" "$GITHUB_WORKSPACE"
