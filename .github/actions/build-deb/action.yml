name: build-deb
description: Build the DEBs of a checked-out tree from its debian/ directory, lint them

# The caller runs as root in a Debian container with dpkg-dev, debhelper, build-essential, git and
# lintian, and has installed what the tree Build-Depends on that Debian does not carry (deb-deps).

inputs:
  tree:
    description: the checkout
    default: .
  tag:
    description: release tag the tree must be at; empty builds a snapshot
    default: ''
  out:
    description: directory the DEBs are copied to
    default: debs
  separator:
    description: what joins a snapshot's version and its commit time and commit; ~git (the default) sorts below the release, +git above it. A staged build or a dry run always takes +git (separator.sh)
    default: ''
  staged:
    description: 'true for a staged build: its snapshot is <version>+git...'
    default: 'false'
  dry-run:
    description: 'true for a release dry run (a run not at a release tag): its snapshot is <version>+git..., above a published <version>'
    default: 'false'

  max-jobs:
    description: The CPUs the runner is declared with, the cap on the build's parallel jobs (the jobs action); empty reads OMX_RUNNER_CPUS, and with neither only the cgroup's quota bounds them
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MAX_JOBS: ${{ inputs.max-jobs }}
        TREE: ${{ inputs.tree }}
        TAG: ${{ inputs.tag }}
        OUT: ${{ inputs.out }}
        SEPARATOR: ${{ inputs.separator }}
        STAGED: ${{ inputs.staged }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        # the parallel jobs from the cgroup's CPU quota and the runner cap, never the host's nproc (actions/jobs)
        jobs=$("$GITHUB_ACTION_PATH/../jobs/jobs.sh" ${MAX_JOBS:+--max "$MAX_JOBS"})
        export DEB_BUILD_OPTIONS="${DEB_BUILD_OPTIONS:+$DEB_BUILD_OPTIONS }parallel=$jobs"  # debhelper's make -j<jobs>
        git config --global --add safe.directory "$(readlink -f "$TREE")"
        args=(-C "$TREE" -s "$("$GITHUB_ACTION_PATH/separator.sh" "$SEPARATOR" "$STAGED" "$DRY_RUN")")
        [ -z "$TAG" ] || args+=(-t "$TAG")
        "$GITHUB_ACTION_PATH/build-deb.sh" "${args[@]}" "$OUT"
