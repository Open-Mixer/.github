name: release-preflight
description: Say whether a run is a release or a dry run, and refuse a release that cannot publish

# Used by the build-rpm and build-deb workflows before any build minutes are spent. A release is a publish
# requested on a tag; anything else is a dry run and needs nothing.

inputs:
  publish:
    description: whether the caller asked to publish
    required: true
  target:
    description: the Pages repository that receives the packages
    required: true
  tag:
    description: the tag being released when the run is not on that tag (a release of another repository); empty means the tag of the run
    default: ''
  require-tag:
    description: a release is a publish on a tag; 'false' lets a workflow that publishes from a branch use this check
    default: 'true'
  packages:
    description: >-
      the binary package names the release builds, space separated (globs allowed); the release is refused when
      the target already serves one of them at the version the tag names. Empty skips that check.
    default: ''
  kind:
    description: >-
      'rpm' or 'deb': the package kind this release publishes; the already-served check reads only that half of the
      channel, so the deb job of a release is not refused by the rpms its own rpm job published a minute earlier.
      Empty reads both.
    default: ''
  releases:
    description: >-
      the Fedora releases (rpm) or Debian suites (deb) this release publishes into, space separated; the
      already-served check reads only those trees, so a version served for fc44 does not refuse its first fc45
      publish. Empty reads every release.
    default: ''
  republish:
    description: "'true' lets a release go out again over a version the channel already serves (a rerun that must finish a partial publish)"
    default: 'false'
  catch-up:
    description: >-
      'true' for a catch-up run (release-matrix): the already-served check does not run, because the plan holds only
      cells the channel lacks for this version and the publish refuses to write any file the channel holds. With
      republish it is refused: a catch-up never rewrites a served file, and republish does.
    default: 'false'
  devel-version:
    description: >-
      The version a merge to devel publishes to the staging channel (its spec's Version, or its debian/changelog's), with
      require-tag false: the already-served check runs for v<devel-version> over the channel root AND staging, and a
      version either holds publishes nothing, green (the output skip is true, a ::notice:: names the served files), ONLY
      when no path since the commit that built it (staging/<kind>/built/<name>/<version>.commit) changes a package
      (package-paths.sh, with exempt); any other path is red, each named with the served version, and so is a served
      version with no such record. The pull request into devel is red for the same change (devel-bump-check).
      A merge to devel builds the real package once; a change after a published build is a new version (.github#289).
      Empty for every other run.
    default: ''
  name:
    description: the source package, whose built/ record a merge to devel of a served version is judged by
    default: ''
  before:
    description: "a merge to devel: github.event.before, the change a served version with no build record is judged by"
    default: ''
  caller-workflow:
    description: "github.workflow_ref of the caller: a merge to devel is judged by the bump-exempt its file had where the diff starts (the recorded build, else github.event.before), never by one the push sets (../devel-bump-check/base-exempt.sh, .github#294); empty judges by exempt"
    default: ''
  exempt:
    description: globs under .github/ only the repository adds to the paths that change no package (.github/**, package-paths.sh, .github#296)
    default: ''
  staged-version:
    description: >-
      The version a dispatched staged run snapshots (its spec's Version, or its debian/changelog's), with require-tag
      false: the channel root and staging are read for a REAL build of v<staged-version> (already-served.sh REAL_ONLY),
      and one is refused by name. A snapshot of a published version is retired: the version is bumped on devel
      (.github#289). Empty for every other run, a merge to devel included.
    default: ''
  gpg-key:
    default: ''
  gpg-passphrase:
    default: ''
  pages-token:
    default: ''

outputs:
  skip:
    description: "'true' when a merge to devel carries a version published already: the caller builds and publishes nothing"
    value: ${{ steps.check.outputs.skip || 'false' }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        TARGET: ${{ inputs.target }}
        GPG_KEY: ${{ inputs.gpg-key }}
        PAGES_TOKEN: ${{ inputs.pages-token }}
        REF: ${{ github.ref }}
        REF_TYPE: ${{ inputs.tag != '' && 'tag' || github.ref_type }}
        REQUIRE_TAG: ${{ inputs.require-tag }}
        TAG: ${{ inputs.tag || github.ref_name }}
        PACKAGES: ${{ inputs.packages }}
        REPUBLISH: ${{ inputs.republish }}
        KIND: ${{ inputs.kind }}
        RELEASES: ${{ inputs.releases }}
        CATCH_UP: ${{ inputs.catch-up }}
        DEVEL_VERSION: ${{ inputs.devel-version }}
        STAGED_VERSION: ${{ inputs.staged-version }}
        NAME: ${{ inputs.name }}
        EXEMPT: ${{ inputs.exempt }}
        BEFORE: ${{ inputs.before }}
        CALLER: ${{ inputs.caller-workflow }}
      run: |
        set -euo pipefail
        if [ "$PUBLISH" != true ] || { [ "$REQUIRE_TAG" = true ] && [ "$REF_TYPE" != tag ]; }; then
          echo "::notice::dry run ($REF): the packages are built and an unsigned tree is assembled; nothing is signed or published"
          exit 0
        fi
        echo "::notice::release of $TAG: sign and publish to $TARGET"
        if [ "${CATCH_UP:-false}" = true ] && [ "$REPUBLISH" = true ]; then
          echo "::error::catch-up and republish together: a catch-up never rewrites a served file, and republish does. Pick one."
          exit 1
        fi

        # a work marker becoming the published version cannot be undone: rpm and dpkg have no downgrade
        if [ "$REQUIRE_TAG" = true ]; then
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' does not match v[0-9]*"; exit 1 ;;
          esac
        fi

        missing=
        # the passphrase is not checked: the packages key is exported without one
        [ -n "$GPG_KEY" ] || missing="$missing signing-key"
        [ -n "$PAGES_TOKEN" ] || missing="$missing PAGES_TOKEN"
        if [ -n "$missing" ]; then
          echo "::error::missing secrets:$missing -- create them as Open-Mixer organisation secrets shared with this repository"
          exit 1
        fi

        status=$(curl -s --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/target.json -w '%{http_code}' \
          -H "Authorization: Bearer $PAGES_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$TARGET")
        if [ "$status" != 200 ]; then
          echo "::error::the target repository $TARGET answered HTTP $status. It must exist, and PAGES_TOKEN must reach it with contents:write. Create it (public, GitHub Pages enabled) or pass another target-repo; this workflow never creates it."
          exit 1
        fi
        push=$(jq -r '.permissions.push // "unknown"' /tmp/target.json)
        [ "$push" != false ] || { echo "::error::PAGES_TOKEN cannot push to $TARGET (contents:write is missing)"; exit 1; }
        echo "target $TARGET: $(jq -r '.visibility' /tmp/target.json), default branch $(jq -r '.default_branch' /tmp/target.json)"

        # Moving old tags (a history rewrite) re-runs their release workflows. A version the channel already serves
        # is never published again: the same NEVRA / deb version would be refused by dnf and apt, or worse, replaced.
        # tree <what> <strict>: the paths of the channel tree, one a line, in /tmp/tree.paths; a truncated tree is refused when strict (a
        # merge to devel and a staged run must prove the version unpublished), a warning otherwise (a tag's check)
        tree() {
          local code
          code=$(curl -s --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/tree.json -w '%{http_code}' \
            -H "Authorization: Bearer $PAGES_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET/git/trees/HEAD?recursive=1")
          [ "$code" = 200 ] || { echo "::error::the tree of $TARGET answered HTTP $code; cannot tell whether $1 is published"; exit 1; }
          if [ "$(jq -r '.truncated' /tmp/tree.json)" = true ]; then
            [ "$2" != strict ] || { echo "::error::the tree of $TARGET is truncated: cannot prove $1 unpublished"; exit 1; }
            echo "::warning::the tree of $TARGET is truncated; the already-served check is partial"
          fi
          jq -r '.tree[].path' /tmp/tree.json > /tmp/tree.paths
        }
        # a merge to devel is judged first: no other input (catch-up, a tag's check) ever stands in for its version check
        if [ -n "${DEVEL_VERSION:-}" ]; then
          [ "${CATCH_UP:-false}" != true ] || { echo "::error::a merge to devel never catches up: it builds v$DEVEL_VERSION once, every cell, or not at all"; exit 1; }
          [ -n "$PACKAGES" ] || { echo "::error::a merge to devel names no packages: cannot tell whether v$DEVEL_VERSION is published"; exit 1; }
          [ "$REPUBLISH" != true ] || { echo "::error::a merge to devel never republishes: a published version is never built again"; exit 1; }
          tree "v$DEVEL_VERSION" strict
          rc=0; STAGING=true ON_SERVED=notice "$GITHUB_ACTION_PATH/already-served.sh" "v$DEVEL_VERSION" $PACKAGES < /tmp/tree.paths || rc=$?
          case $rc in
            0) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            3) ;;
            *) exit "$rc" ;;
          esac
          if [ "$rc" = 3 ]; then
            # served: green only when nothing that can change a package changed, since the recorded build, or, with no
            # record (a version published before the records), in this push itself (../package-paths/served-change.sh)
            [ -n "$NAME" ] && [ -n "$KIND" ] || { echo "::error::v$DEVEL_VERSION is published, and the preflight names no package-name and kind to read the record of its build by"; exit 1; }
            rec=staging/$KIND/built/$NAME/$DEVEL_VERSION.commit built=''
            if grep -qxF "$rec" /tmp/tree.paths; then
              code=$(curl -s --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/built.commit -w '%{http_code}' \
                -H "Authorization: Bearer $PAGES_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/$TARGET/contents/$rec")
              [ "$code" = 200 ] || { echo "::error::$rec of $TARGET answered HTTP $code: cannot tell what changed since the build of v$DEVEL_VERSION"; exit 1; }
              built=$(tr -d '[:space:]' < /tmp/built.commit)
              [[ $built =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$rec holds '$built', not a full commit"; exit 1; }
            fi
            # judged by the bump-exempt the caller's workflow had at the commit the diff starts from, never by one this push
            # sets: the recorded build when there is one (R1, built..HEAD), else github.event.before (B1, before..HEAD)
            judged=''
            if [ -n "${CALLER:-}" ]; then
              if [ -n "$built" ]; then from=$built fromlabel="the build"; else from=${BEFORE:-} fromlabel="github.event.before"; fi
              got=$("$GITHUB_ACTION_PATH/../devel-bump-check/base-exempt.sh" "$from" "$CALLER" "build-$KIND.yml" "${EXEMPT:-}" "$fromlabel" "HEAD") || { printf '%s\n' "$got"; exit 1; }
              EXEMPT=$(sed -n 's/^value=//p' <<< "$got") judged=$(sed -n 's/^differs=//p' <<< "$got") EXEMPT_AT=$from
              export EXEMPT EXEMPT_AT
              [ -z "$judged" ] || echo "::notice::$judged: this push is judged by the value at $fromlabel; a changed bump-exempt takes effect once a build or push starts from it"
            fi
            "$GITHUB_ACTION_PATH/../package-paths/served-change.sh" "$DEVEL_VERSION" "$rec" "$built" "${BEFORE:-}" "this push (github.event.before..HEAD)" || {
              [ -z "$judged" ] || echo "::error::$judged: judged by the value at $fromlabel, so the change above is packaged"
              exit 1
            }
            echo "::notice::v$DEVEL_VERSION is published already: this merge to devel builds and publishes nothing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        elif [ -n "${STAGED_VERSION:-}" ]; then
          [ -n "$PACKAGES" ] || { echo "::error::a staged run names no packages: cannot tell whether v$STAGED_VERSION is published"; exit 1; }
          tree "v$STAGED_VERSION" strict
          STAGING=true REAL_ONLY=true "$GITHUB_ACTION_PATH/already-served.sh" "v$STAGED_VERSION" $PACKAGES < /tmp/tree.paths
        elif [ "${CATCH_UP:-false}" = true ]; then
          echo "::notice::catch-up of $TAG: the version is served, so the already-served check does not run; the plan holds only the cells the channel lacks, and the publish refuses to write any file the channel holds"
        elif [ "$REQUIRE_TAG" = true ] && [ -n "$PACKAGES" ] && [ "$REPUBLISH" != true ]; then
          tree "$TAG" partial
          "$GITHUB_ACTION_PATH/already-served.sh" "$TAG" $PACKAGES < /tmp/tree.paths
        fi
