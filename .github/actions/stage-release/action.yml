name: stage-release
description: Put a staged run's packages on the prerelease staged-v<version> of the repository, for install-staged

# The staged job of build-rpm.yml and build-deb.yml (staged: true). Nothing goes to the channel and no v* tag is made:
# the prerelease is assets only, and the real release of the version publishes once from its tag (stage-release.sh).
# kind: remove is the release of v<version> deleting that prerelease and its tag (the unstage job of both workflows):
# staged files sort above the release's, so they do not outlive it. The job needs permissions contents: write.

inputs:
  kind:
    description: rpm or deb, or remove
    required: true
  version:
    description: the version the packages are, the spec's Version or debian/changelog's upstream version; with remove, the released version or its v<version> tag
    required: true
  dir:
    description: the downloaded artifacts (rpm, any depth; deb, <suite>/*.deb); not read by remove
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KIND: ${{ inputs.kind }}
        VERSION: ${{ inputs.version }}
        DIR: ${{ inputs.dir }}
      run: '"$GITHUB_ACTION_PATH/stage-release.sh" "$KIND" "$VERSION" ${DIR:+"$DIR"}'
