name: commit-message-check
description: Fail when a commit, the title or the body of the pull request carries an attribution line or names the AI tool in prose

# A commit message is published like a file. The commits between the base branch and the checked-out head are read
# (what is already on the base is not, nor, with upstream-url, a fork's upstream commits); the checker is run against
# its own fixtures first and must go blind when its patterns are removed. The patterns are commit-message-patterns.json
# beside the script: the one list, edited here, which every repository's doors and commit-msg hook read from a checkout
# of this repository.
# Two kinds of hit, one list: the trailer and footer shapes (markers), and the AI tool named in words, any case:
# the tool vendor and product names, AI-generated / AI-assisted, generated by AI, written by AI (prose). A path-like token (a slash in
# it, or a file extension at its end: .claude/skills/x.md, CLAUDE.md, run.sh) is not judged here; private-refs-check
# judges paths. Only the commits between the base and the head are read, never what is already on the base, so an old
# commit is never reddened by a new rule. The title and body of the pull request are judged by the same list.
# The caller checks out with fetch-depth: 0 and the pull request head.

inputs:
  base-ref:
    description: the branch the pull request targets
    default: ${{ github.base_ref }}
  pr-title:
    description: the pull request title, judged by the same list
    default: ${{ github.event.pull_request.title }}
  pr-body:
    description: the pull request body, judged by the same list
    default: ${{ github.event.pull_request.body }}
  upstream-url:
    description: a fork's upstream URL (an exact line of ../upstream-exempt/upstream-allowed.txt); its own commits are exempt from both message checks. Empty, no exemption
    default: ''

runs:
  using: composite
  steps:
    - name: The checker catches a fixture and goes blind when its patterns are removed
      shell: bash
      run: ${{ github.action_path }}/commit-message-check.sh --selftest
    - name: Scan the commits of the pull request
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        UPSTREAM_URL: ${{ inputs.upstream-url }}
      run: |
        set -euo pipefail
        [ -n "$BASE_REF" ] || { echo 'commit-message-check: no base-ref (run on a pull_request)' >&2; exit 2; }
        "${{ github.action_path }}/commit-message-check.sh" ${UPSTREAM_URL:+--upstream-url "$UPSTREAM_URL"} "origin/$BASE_REF..HEAD"
    - name: The title and body of the pull request carry no attribution and name no AI tool in prose
      shell: bash
      env:
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        set -euo pipefail
        f=$(mktemp)
        printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$f"
        rc=0; "${{ github.action_path }}/commit-message-check.sh" --text-file "$f" || rc=$?
        rm -f "$f"
        exit "$rc"
    - name: The same commits name no private repository, machine or path
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        GH_TOKEN: ${{ github.token }}
        UPSTREAM_URL: ${{ inputs.upstream-url }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/../private-refs-check/check.sh" ${UPSTREAM_URL:+--upstream-url "$UPSTREAM_URL"} --messages "origin/$BASE_REF..HEAD"
