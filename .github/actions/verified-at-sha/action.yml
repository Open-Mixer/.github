name: verified-at-sha
description: Refuse a release of a commit that carries no success cluster/verify status

# Called by the preflight of build-rpm.yml and build-deb.yml on every release run (a tag, or source-ref), the one place
# every tag path crosses, a tag pushed by a tool or by hand. The commit judged is the one checked out, the one the
# build will use. check.sh says what passes; the action first proves the judge goes red on each refused shape, then
# reads the status. Absent, pending or red is a refusal by name, never a wait.

inputs:
  repository:
    description: the repository whose commit is released (owner/repo)
    required: true
  sha:
    description: the commit released; empty is the checkout's HEAD in the workspace
    default: ''
  token:
    description: a token that can read the repository's commit statuses (a public repository's read without one)
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        SHA: ${{ inputs.sha }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/check.sh" --self-test
        sha=${SHA:-$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)}
        "$GITHUB_ACTION_PATH/check.sh" "$REPOSITORY" "$sha"
