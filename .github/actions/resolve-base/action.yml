name: resolve-base
description: Resolve the base of a compare gate the one way, fetched and verified, or refuse it by name

# A compare gate (a baseline that only shrinks, a debt that only falls) reads its base through this action, never by
# its own rev-parse: the remote base is fetched first and a failed fetch is refused (a stale remote-tracking ref is no
# base), an empty base and HEAD are refused by name, the name is verified with rev-parse, and the merge-base with HEAD
# is where the base's files are read. The caller has checked the repository out with fetch-depth 0 (a merge-base git
# cannot find is refused, naming that). Exit 1 is a base the workflow got wrong, 2 a checkout that cannot give it.

inputs:
  base:
    description: the base ref (origin/${{ github.base_ref }} on a pull request); empty is refused, never a default
    required: true
  merge-base:
    description: also give the merge-base with HEAD (false for a gate that reads the base's tip)
    default: 'true'
outputs:
  commit:
    description: the commit the base resolves to
    value: ${{ steps.resolve.outputs.commit }}
  merge-base:
    description: the merge-base of HEAD and the base (empty when merge-base is false)
    value: ${{ steps.resolve.outputs.merge-base }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        MERGE_BASE: ${{ inputs.merge-base }}
      run: |
        if [ "$MERGE_BASE" = true ]; then
          "$GITHUB_ACTION_PATH/resolve-base.sh" "$BASE"
        else
          "$GITHUB_ACTION_PATH/resolve-base.sh" "$BASE" --no-merge-base
        fi
